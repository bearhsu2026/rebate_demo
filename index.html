      color: var(--color-on-primary-3);
    }
    .achievement-arrow {
      flex-shrink: 0;
      color: var(--color-on-primary-3);
      font-size: 18px;
      opacity: 0.5;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .achievement-card:hover .achievement-arrow {
      transform: translateX(3px);
      opacity: 0.9;
    }
    /* Stats inside achievement (cumulative bet progress + total rebate) */
    .achievement-stats {
      padding: var(--spacing-3) var(--spacing-5) var(--spacing-5);
      border-top: 1px solid var(--color-outline-variant);
    }
    .achievement-stat-row {
      margin-top: var(--spacing-4);
    }
    .achievement-stat-row:first-child { margin-top: 0; }
    .achievement-stat-label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: var(--spacing-2);
    }
    .achievement-stat-label {
      font-size: 11px;
      color: var(--color-on-primary-3);
      letter-spacing: 0.03em;
    }
    .achievement-stat-value {
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      font-variant-numeric: tabular-nums;
    }
    .achievement-stat-value.teal {
      color: var(--color-primary);
    }
    .achievement-stat-value.gold {
      color: var(--tier-gold-color);
    }
    .achievement-progress-track {
      height: 8px;
      background: var(--color-surface-variant);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .achievement-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--tier-gold-color), #fff4a0);
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      border-radius: var(--radius-full);
      box-shadow: 0 0 8px rgba(255,209,0,0.45);
    }
    .achievement-progress-fill.maxed {
      background: linear-gradient(90deg, var(--color-preset-green), #6fffd5);
      box-shadow: 0 0 8px rgba(21,234,72,0.45);
    }
    .achievement-divider {
      height: 1px;
      background: var(--color-outline-variant);
      margin: var(--spacing-4) 0;
    }

    /* ═══════════════════════════════════════════════════
       Compact tier table (shared by no-bet Tier Preview)
    ═══════════════════════════════════════════════════ */
    /* Compact tier table for no-bet preview */
    .tier-mini-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
      padding: var(--spacing-2) 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: var(--font-body-small);
    }
    .tier-mini-row:last-child { border-bottom: none; }
    .tier-mini-row .tier-mini-icon {
      width: 24px; height: 24px;
      border-radius: var(--radius-s);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .tier-mini-row .tier-mini-icon.bronze  { background: rgba(255,114,0,0.18); }
    .tier-mini-row .tier-mini-icon.silver  { background: rgba(200,200,200,0.10); }
    .tier-mini-row .tier-mini-icon.gold    { background: rgba(255,209,0,0.15); }
    .tier-mini-row .tier-mini-icon.diamond { background: rgba(0,210,190,0.15); }
    .tier-mini-row .tier-mini-name {
      min-width: 50px;
      font-weight: var(--font-weight-semibold);
      flex-shrink: 0;
    }
    .tier-mini-row .tier-mini-name.bronze  { color: var(--tier-bronze-color); }
    .tier-mini-row .tier-mini-name.silver  { color: var(--tier-silver-color); }
    .tier-mini-row .tier-mini-name.gold    { color: var(--tier-gold-color); }
    .tier-mini-row .tier-mini-name.diamond { color: var(--tier-diamond-color); }
    .tier-mini-row .tier-mini-detail {
      flex: 1;
      color: var(--color-on-primary-2);
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
    }
    .tier-mini-row .tier-mini-detail .rebate-num {
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
      margin-left: 2px;
    }
    .tier-mini-row .tier-mini-badge-mark {
      display: inline-block;
      margin-left: var(--spacing-1);
      padding: 0 5px;
      border-radius: var(--radius-xs);
      background: rgba(255,209,0,0.18);
      border: 1px solid rgba(255,209,0,0.45);
      color: var(--tier-gold-color);
      font-size: 9px;
      font-weight: var(--font-weight-semibold);
      vertical-align: middle;
      letter-spacing: 0.04em;
    }
    .tier-mini-cap-note {
      font-size: 10px;
      color: var(--color-on-primary-3);
      text-align: center;
      margin-top: var(--spacing-2);
      letter-spacing: 0.03em;
    }

    /* ═══════════════════════════════════════════════════
       U0 Tier Preview (inside no-bet state)
    ═══════════════════════════════════════════════════ */
    .hero-tier-preview {
      background: rgba(0,0,0,0.30);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-m);
      padding: var(--spacing-4);
      margin-bottom: var(--spacing-4);
      text-align: left;
    }
    .hero-tier-preview-title {
      font-size: var(--font-body-small);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      margin-bottom: var(--spacing-3);
      text-align: center;
    }

    /* ═══════════════════════════════════════════════════
       T2 Final Summary (event ended)
    ═══════════════════════════════════════════════════ */
    .hero-card.final-summary {
      position: relative;
      text-align: center;
      padding: var(--spacing-6) var(--spacing-5);
      background:
        radial-gradient(ellipse 100% 70% at 50% 0%, rgba(255,209,0,0.10) 0%, transparent 65%),
        linear-gradient(180deg, #1f1235 0%, #150925 100%);
      border: 1px solid rgba(255,209,0,0.25);
    }
    .final-summary-title {
      font-size: var(--font-title-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      margin-bottom: var(--spacing-5);
      letter-spacing: 0.04em;
    }
    .final-summary-stat {
      margin-bottom: var(--spacing-4);
    }
    .final-summary-stat:last-of-type { margin-bottom: var(--spacing-5); }
    .final-summary-stat-label {
      font-size: 11px;
      color: var(--color-on-primary-3);
      letter-spacing: 0.04em;
      margin-bottom: var(--spacing-1);
    }
    .final-summary-stat-value {
      font-size: var(--font-title-large);
      font-weight: var(--font-weight-semibold);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    .final-summary-stat-value.bet  { color: var(--color-on-primary-1); }
    .final-summary-stat-value.rebate {
      background: linear-gradient(180deg, #fff4a0 0%, #ffd100 45%, #ff9d00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255,209,0,0.35));
    }
    .final-summary-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-3) var(--spacing-5);
      border-radius: var(--radius-full);
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.03em;
      margin-bottom: var(--spacing-4);
    }
    .final-summary-badge.earned {
      background: linear-gradient(180deg, rgba(255,209,0,0.30), rgba(255,165,0,0.15));
      border: 1px solid rgba(255,209,0,0.65);
      color: var(--tier-gold-color);
      box-shadow: 0 0 18px rgba(255,209,0,0.30);
    }
    .final-summary-badge.missed {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.18);
      color: var(--color-on-primary-3);
    }
    .final-summary-closing {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
      margin-top: var(--spacing-4);
      padding-top: var(--spacing-4);
      border-top: 1px solid rgba(255,255,255,0.08);
      line-height: 1.6;
    }
    /* Final-summary rules CTA (text-link inside ended-state card) */
    .final-summary-rules-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-2);
      width: 100%;
      padding: var(--spacing-3) var(--spacing-5);
      background: rgba(130,56,186,0.18);
      border: 1px solid rgba(130,56,186,0.45);
      border-radius: var(--radius-full);
      color: var(--color-on-primary-1);
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      font-family: var(--font-family);
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .final-summary-rules-cta:hover {
      background: rgba(130,56,186,0.32);
      border-color: rgba(130,56,186,0.7);
      transform: translateY(-1px);
    }

    /* ═══════════════════════════════════════════════════
       Cap-reached payout hint (inside Hero card)
    ═══════════════════════════════════════════════════ */
    .hero-cap-payout-note {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-2);
      padding: var(--spacing-2) var(--spacing-3);
      background: linear-gradient(90deg, rgba(255,209,0,0.18), rgba(255,209,0,0.06));
      border: 1px solid rgba(255,209,0,0.35);
      border-radius: var(--radius-s);
      margin-bottom: var(--spacing-3);
      font-size: 12px;
      color: var(--tier-gold-color);
      font-weight: var(--font-weight-semibold);
    }

    /* Body scroll lock helper */
    body.modal-open {
      overflow: hidden;
    }

    /* ═══════════════════════════════════════════════════
       Fixed Bottom CTA (Play Now)
    ═══════════════════════════════════════════════════ */
    .cta-fixed {
      position: fixed;
      bottom: var(--spacing-4);
      left: var(--spacing-5);
      right: var(--spacing-5);
      z-index: 998;
      max-width: var(--container-standard);
      margin: 0 auto;
      pointer-events: none;  /* container is transparent, only inner link is clickable */
    }
    /* Hide bottom CTA when activity is prelaunch or ended */
    body.hide-fixed-cta .cta-fixed {
      display: none;
    }
    body.hide-fixed-cta {
      padding-bottom: var(--spacing-7) !important;
    }

    /* ═══════════════════════════════════════════════════
       Connecting hint (inside skeleton, shown when handshake slow)
    ═══════════════════════════════════════════════════ */
    .connecting-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-2);
      margin-top: var(--spacing-4);
      padding: var(--spacing-2) var(--spacing-3);
      font-size: 11px;
      color: var(--color-on-primary-3);
      letter-spacing: 0.04em;
      animation: fade-in 0.3s ease;
    }
    .connecting-hint.urgent {
      color: var(--color-preset-gold);
    }
    .connecting-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
      animation: connecting-pulse 1.2s ease-in-out infinite;
    }
    .connecting-hint.urgent .connecting-dot {
      background: var(--color-preset-gold);
    }
    @keyframes connecting-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.3); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ═══════════════════════════════════════════════════
       Connection-failed card (after 30s handshake timeout)
    ═══════════════════════════════════════════════════ */
    .hero-card.connection-failed {
      text-align: center;
      padding: var(--spacing-7) var(--spacing-5);
      border-style: dashed;
      border-color: rgba(255,165,0,0.3);
    }
    .connection-failed-icon {
      font-size: 48px;
      margin-bottom: var(--spacing-3);
      filter: drop-shadow(0 0 12px rgba(255,165,0,0.4));
    }
    .connection-failed-title {
      font-size: var(--font-title-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      margin-bottom: var(--spacing-2);
      letter-spacing: 0.02em;
    }
    .connection-failed-sub {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
      margin-bottom: var(--spacing-5);
      line-height: 1.5;
    }
    .connection-retry-btn {
      display: block;
      width: 100%;
      max-width: 280px;
      margin: 0 auto var(--spacing-3);
      padding: var(--spacing-3) var(--spacing-5);
      background: linear-gradient(135deg, #ffa500 0%, #ffd100 50%, #ffa500 100%);
      border: 1.5px solid rgba(255,255,255,0.45);
      border-radius: var(--radius-full);
      color: #4a2a00;
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      font-family: var(--font-family);
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.10),
        0 6px 18px rgba(255,165,0,0.40),
        inset 0 1px 0 rgba(255,255,255,0.50);
      transition: transform 0.18s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .connection-retry-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.10),
        0 10px 24px rgba(255,165,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.55);
    }
    .connection-retry-btn:active { transform: translateY(0); }
    .connection-rules-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: none;
      border: none;
      padding: var(--spacing-2) var(--spacing-3);
      color: var(--color-on-primary-2);
      font-size: var(--font-body-small);
      font-family: var(--font-family);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      letter-spacing: 0.02em;
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,0.25);
      text-underline-offset: 3px;
      transition: color 0.2s;
    }
    .connection-rules-btn:hover { color: var(--color-primary); }
    .cta-fixed a {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-2);
      width: 100%;
      padding: var(--spacing-4) var(--spacing-6);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 50%),
        linear-gradient(135deg, #8238BA 0%, #B85FE0 50%, #00D2BE 100%);
      background-size: 100% 100%, 200% 100%;
      border: 1.5px solid rgba(255,255,255,0.40);
      border-radius: var(--radius-full);
      color: #fff;
      font-size: var(--font-title-small);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.06em;
      text-decoration: none;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.10),
        0 8px 24px rgba(130,56,186,0.55),
        0 0 32px rgba(0,210,190,0.35),
        inset 0 1px 0 rgba(255,255,255,0.30);
      transition: transform 0.18s ease, background-position 0.5s ease, box-shadow 0.2s ease;
      animation: cta-pulse 2.4s ease-in-out infinite;
      backdrop-filter: blur(2px);
      -webkit-tap-highlight-color: transparent;
    }
    .cta-fixed a:hover {
      transform: translateY(-2px);
      background-position: 0 0, 100% 0;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.10),
        0 12px 32px rgba(130,56,186,0.7),
        0 0 48px rgba(0,210,190,0.55),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .cta-fixed a:active {
      transform: translateY(0);
      transition-duration: 0.08s;
    }
    .cta-fixed .cta-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      font-size: 11px;
      padding-left: 2px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.40);
    }
    @keyframes cta-pulse {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(0,0,0,0.10),
          0 8px 24px rgba(130,56,186,0.55),
          0 0 32px rgba(0,210,190,0.35),
          inset 0 1px 0 rgba(255,255,255,0.30);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(0,0,0,0.10),
          0 8px 28px rgba(130,56,186,0.75),
          0 0 50px rgba(0,210,190,0.55),
          inset 0 1px 0 rgba(255,255,255,0.30);
      }
    }

    /* Body padding to prevent content being hidden behind fixed CTA */
    body {
      padding-bottom: calc(var(--spacing-10) + 32px) !important;
    }
    @media (max-width: 767px) {
      body {
        padding-bottom: calc(var(--spacing-10) + 40px) !important;
      }
    }
  </style>
</head>
<body>

  <!-- Language Switcher -->
  <div class="lang-switcher" id="lang-switcher">
    <button class="lang-btn active" data-lang="zh-TW" onclick="setLang('zh-TW')">繁中</button>
    <button class="lang-btn"        data-lang="zh-CN" onclick="setLang('zh-CN')">简中</button>
    <button class="lang-btn"        data-lang="en"    onclick="setLang('en')">EN</button>
    <button class="lang-btn"        data-lang="ja"    onclick="setLang('ja')">日</button>
  </div>

  <!-- Header (slim) -->
  <header class="header">
    <div class="header-deco">
      <!-- Planets -->
      <div class="deco-planet-saturn">
        <div class="ball"></div>
        <div class="ring"></div>
      </div>
      <div class="deco-planet-moon"></div>
      <!-- Diamonds -->
      <div class="deco-diamond d1"></div>
      <div class="deco-diamond d2"></div>
      <div class="deco-diamond d3"></div>
      <div class="deco-diamond d4"></div>
      <div class="deco-diamond d5"></div>
      <!-- Coins -->
      <div class="deco-coin c1"></div>
      <div class="deco-coin c2"></div>
    </div>
    <div class="day-badge">
      <span class="day-badge-dot"></span>
      <span id="day-label">Day — / 3</span>
    </div>
    <h1 class="activity-title" id="header-title">博弈遊戲王</h1>
    <p class="activity-dates">2026.05.27 — 2026.05.29 <span class="activity-tz">(UTC+8)</span></p>

    <!-- Slim countdown pill (replaces the big 4-cell grid) -->
    <div class="countdown-pill" id="countdown-pill">
      <span class="countdown-pill-icon" aria-hidden="true">⏰</span>
      <span id="countdown-pill-label">距活動結束</span>
      <span class="countdown-pill-time" id="countdown-pill-time">--</span>
    </div>

    <div class="games-row">
      <span class="game-tag">
        <img class="game-tag-img" id="game1-img" alt="" loading="lazy"
             onerror="this.style.display='none'">
        <span id="game1-tag">龍乳鬥白虎</span>
      </span>
      <span class="game-tag">
        <img class="game-tag-img" id="game2-img" alt="" loading="lazy"
             onerror="this.style.display='none'">
        <span id="game2-tag">一柱擎天</span>
      </span>
      <span class="game-tag">
        <img class="game-tag-img" id="game3-img" alt="" loading="lazy"
             onerror="this.style.display='none'">
        <span id="game3-tag">金射狂風</span>
      </span>
    </div>
  </header>

  <div class="page-content">

    <!-- ── ⭐ HERO Section (主轉化點) ── -->
    <div class="section" id="section-hero">
      <!-- Skeleton -->
      <div class="hero-skeleton skeleton-card" id="skeleton-hero">
        <div class="skel-line short" style="margin: 0 auto var(--spacing-3);"></div>
        <div class="skel-line wide" style="height: 56px; margin: 0 auto var(--spacing-4); max-width: 60%;"></div>
        <div class="skel-line medium" style="margin: 0 auto;"></div>
        <!-- Soft connecting hint (shown when handshake takes longer than expected) -->
        <div class="connecting-hint hidden" id="connecting-hint">
          <span class="connecting-dot"></span>
          <span id="connecting-hint-text">正在連線…</span>
        </div>
      </div>

      <!-- Connection failed (after 30s timeout) — graceful degradation -->
      <div class="hero-card connection-failed hidden" id="hero-connection-failed">
        <div class="connection-failed-icon">⚠️</div>
        <div class="connection-failed-title" id="connection-failed-title">本活動不支援現有裝置</div>
        <div class="connection-failed-sub" id="connection-failed-sub">請使用 SWAG 網頁版開啟</div>
        <button class="connection-retry-btn" id="connection-retry-btn" type="button">
          <span id="connection-retry-text">🌐 前往 SWAG 網頁版</span>
        </button>
        <button class="connection-rules-btn" id="connection-rules-btn" type="button">
          <span id="connection-rules-text">📖 查看活動規則</span>
        </button>
      </div>

      <!-- T1: In-progress + bet placed -->
      <div class="hero-card hidden" id="hero-card"></div>

      <!-- T1: In-progress + no bet today -->
      <div class="hero-card no-bet hidden" id="hero-no-bet">
        <div class="hero-no-bet-icon">🎮</div>
        <div class="hero-no-bet-title" id="hero-no-bet-title">今日尚未下注</div>
        <div class="hero-no-bet-sub" id="hero-no-bet-sub">下注指定遊戲即可開始累積返鑽</div>

        <!-- Tier-preview (definite "bet X → earn Y") -->
        <div class="hero-tier-preview" id="hero-no-bet-tier-preview"></div>

        <!-- Rules link (above CTA) -->
        <button class="hero-no-bet-rules-link" id="hero-no-bet-rules-btn" type="button">
          <span id="hero-no-bet-rules-text">📖 查看活動規則</span>
        </button>

        <!-- Big CTA -->
        <a class="hero-cta-btn no-bet-cta-big" id="hero-no-bet-cta"
           href="https://swag.live/livestream/0?campaign-id=open-game-menu"
           target="_blank" rel="noopener noreferrer">
          <span class="hero-cta-shimmer" aria-hidden="true"></span>
          <span class="cta-main-text" id="hero-no-bet-cta-text">▶ 立即開始下注</span>
        </a>
      </div>

      <!-- T2: Event ended · final summary -->
      <div class="hero-card final-summary hidden" id="hero-final-summary"></div>
    </div>

    <!-- ── 📊 Status Section (我的當前狀態 - 次要三欄) ── -->
    <div class="section" id="section-status">
      <div class="section-title" id="label-badge-section">我的當前狀態</div>
      <div class="skeleton-card" id="skeleton-summary">
        <div class="skel-row">
          <div class="skel-block"></div>
          <div class="skel-block"></div>
          <div class="skel-block"></div>
        </div>
      </div>
      <div class="status-card hidden" id="status-card"></div>
    </div>

    <!-- ── 🏆 Achievement Section (徽章 + 累積合併成長敘事) ── -->
    <div class="section" id="section-achievement">
      <div class="section-title" id="label-summary-section">我的成就</div>
      <div class="skeleton-card" id="skeleton-badge">
        <div class="skel-line medium"></div>
        <div class="skel-line short" style="margin-top: var(--spacing-4);"></div>
      </div>
      <div class="achievement-card hidden" id="achievement-card"></div>
    </div>

    <!-- ── 📜 Settled Records Section ── -->
    <div class="section hidden" id="section-records">
      <div class="records-header">
        <div class="section-title" id="label-records-section">已結算紀錄</div>
        <div class="total-rebate-chip" id="total-rebate-chip" style="display:none;"></div>
      </div>

      <!-- Records content (hidden until loaded) -->
      <div class="hidden" id="records-content"></div>

      <!-- No records state (kept for i18n compatibility, never actually shown per current spec) -->
      <div class="hidden" id="no-records">
        <div style="text-align:center; padding: var(--spacing-6) 0; color: var(--color-on-primary-3); font-size: var(--font-body-small);" id="no-records-text">尚無結算紀錄</div>
      </div>
    </div>

    <!-- ── Notice Section ── -->
    <div class="section">
      <div class="rules-toggle notice-toggle" onclick="toggleNotice()">
        <span class="rules-toggle-label">
          <span class="notice-icon" aria-hidden="true">⚠️</span>
          <span id="label-notice">注意事項</span>
        </span>
        <span class="rules-arrow" id="notice-arrow">▼</span>
      </div>
      <div class="rules-body notice-body" id="notice-body">
        <ol class="notice-list" id="notice-list">
          <!-- rendered by JS -->
        </ol>
      </div>
    </div>

  </div><!-- /page-content -->

  <!-- Fixed Bottom CTA -->
  <div class="cta-fixed" id="cta-fixed">
    <a href="https://swag.live/livestream/0?campaign-id=open-game-menu"
       target="_blank"
       rel="noopener noreferrer"
       id="cta-play-now-link">
      <span class="cta-icon" aria-hidden="true">▶</span>
      <span id="cta-play-now-text">立即玩遊戲</span>
    </a>
  </div>

  <!-- Badge Modal (Anime style) -->
  <div class="badge-modal-scrim" id="badge-modal-scrim" role="dialog" aria-modal="true" aria-labelledby="badge-modal-title" aria-hidden="true">
    <div class="badge-modal" id="badge-modal">
      <button class="badge-modal-close" id="badge-modal-close" aria-label="Close">×</button>

      <div class="badge-modal-hero" id="badge-modal-hero">
        <!-- SVG injected by JS; fallback handled in code -->
      </div>

      <h2 class="badge-modal-title" id="badge-modal-title">博弈遊戲王</h2>

      <div class="badge-modal-status" id="badge-modal-status">
        <span id="badge-modal-status-text">尚未獲得</span>
      </div>

      <div class="badge-modal-section">
        <div class="badge-modal-section-label" id="badge-modal-how-label">獲得方式</div>
        <div class="badge-modal-section-body" id="badge-modal-how-body">下注直播間遊戲達 50,000 鑽</div>
      </div>

      <div class="badge-modal-section badge-modal-progress" id="badge-modal-progress-section">
        <div class="badge-modal-section-label" id="badge-modal-progress-label">獲取進度</div>
        <div class="badge-modal-progress-nums">
          <span class="current" id="badge-modal-progress-current">0</span>
          <span class="threshold" id="badge-modal-progress-threshold">/ 50,000</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="badge-modal-progress-fill" style="width:0%"></div>

    let currentLang = "zh-TW";

    /* ═══════════════════════════════════════════════════
       Utilities
    ═══════════════════════════════════════════════════ */
    function esc(str) {
      const d = document.createElement("div");
      d.textContent = str == null ? "" : String(str);
      return d.innerHTML;
    }

    function t(key, vars) {
      let s = (I18N[currentLang] || I18N["zh-TW"])[key] || key;
      if (vars) Object.entries(vars).forEach(([k, v]) => { s = s.replace("{" + k + "}", v); });
      return s;
    }

    function fmtNum(n) {
      return Number(n).toLocaleString();
    }

    function getCurrentActivityDay() {
      const start = new Date("2026-05-27T00:00:00+08:00").getTime();
      const now   = Date.now();
      const day   = Math.floor((now - start) / 86400000) + 1;
      return Math.min(3, Math.max(1, day));
    }

    function parseBetDate(dateStr) {
      // "2026-05-27" or "2026-05-27T..." → "2026-05-27"
      return String(dateStr || "").slice(0, 10);
    }

    function formatDisplayDate(dateStr) {
      const d = parseBetDate(dateStr);
      const parts = d.split("-");
      if (parts.length < 3) return d;
      return `${parts[1]}/${parts[2]}`;
    }

    function getDayNum(dateStr) {
      const start = new Date("2026-05-27T00:00:00+08:00").getTime();
      const target = new Date(parseBetDate(dateStr) + "T00:00:00+08:00").getTime();
      return Math.floor((target - start) / 86400000) + 1;
    }

    function tierProgress(level, dailyBet) {
      const prev = TIER_PREV_MIN[level] || 0;
      const next = TIER_META[level] ? TIER_META[level].nextMin : null;
      if (!next) return { pct: 100, needed: 0, isMax: true };
      const range = next - prev;
      const done  = Math.max(0, dailyBet - prev);
      const pct   = Math.min(100, (done / range) * 100);
      const needed = Math.max(0, next - dailyBet);
      return { pct, needed, isMax: false };
    }

    /**
     * Return next-tier estimate object.
     * Uses TIER_META.rate (raw rate, NOT final_rebate_rate) because final_rebate_rate
     * already includes bonus (+0.5%) which doesn't apply to "what if I reach next tier" estimation.
     */
    const TIER_ORDER = ["none", "bronze", "silver", "gold", "diamond"];
    const RAW_TIER_RATE_DECIMAL = {
      bronze: 0.010, silver: 0.015, gold: 0.020, diamond: 0.025
    };
    const DAILY_REBATE_CAP = 10000;

    function nextTierEstimate(currentLevel, dailyBet) {
      // No tier yet → next is bronze (1,000)
      const idx = TIER_ORDER.indexOf(currentLevel);
      if (idx < 0 || currentLevel === "diamond") {
        return { isMax: currentLevel === "diamond" };
      }
      const nextLevel = TIER_ORDER[idx + 1];
      const nextThreshold = TIER_META[currentLevel].nextMin;
      const gap = Math.max(0, nextThreshold - dailyBet);
      const rate = RAW_TIER_RATE_DECIMAL[nextLevel] || 0;
      // Rebate if user reaches threshold exactly
      const estMax = Math.min(Math.floor(nextThreshold * rate), DAILY_REBATE_CAP);
      return {
        isMax: false,
        nextLevel,
        gap,
        rate,
        estMax,
      };
    }

    /**
     * Format ISO timestamp into relative-time text (zh-TW style by default).
     * Uses currentLang via t() lookups.
     */
    function relativeTimeFromNow(isoStr) {
      if (!isoStr) return "";
      const ts = new Date(isoStr).getTime();
      if (isNaN(ts)) return "";
      const diffMs = Date.now() - ts;
      const diffSec = Math.floor(diffMs / 1000);
      if (diffSec < 60)        return t("updatedJustNow");
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60)        return t("updatedMinsAgo", { n: diffMin });
      const diffHour = Math.floor(diffMin / 60);
      return t("updatedHoursAgo", { n: diffHour });
    }

    /**
     * Countdown timer — updates header every second.
     */
    let countdownTimer = null;
    const ACTIVITY_END_TS   = new Date("2026-05-29T23:59:59+08:00").getTime();

    /**
     * Get current activity phase: "running" | "ended"
     * Allow simulating phase via ?phase= URL param for QA in dev mode.
     * Note: pre-launch is no longer a distinct phase — the countdown pill
     * just keeps counting down to ACTIVITY_END_TS regardless of start time.
     */
    function getActivityPhase() {
      if (typeof window !== "undefined" && window.location && window.location.search) {
        const params = new URLSearchParams(window.location.search);
        const forced = params.get("phase");
        if (["running", "ended"].includes(forced)) return forced;
      }
      const now = Date.now();
      if (now > ACTIVITY_END_TS) return "ended";
      return "running";
    }

    /**
     * Tier preview data — used by both prelaunch card and no-bet tier preview.
     * Each row: { tier, threshold, rate, exampleBet, exampleRebate, isBadge }
     * "exampleBet" is the minimum bet that qualifies for this tier; "exampleRebate"
     * is the rebate at that minimum bet (capped by DAILY_REBATE_CAP).
     */
    function getTierPreviewRows() {
      const rows = [
        { tier: "bronze",  threshold: 1000,    rate: 0.010 },
        { tier: "silver",  threshold: 10000,   rate: 0.015 },
        { tier: "gold",    threshold: 50000,   rate: 0.020 },
        { tier: "diamond", threshold: 200000,  rate: 0.025 },
      ];
      return rows.map(r => {
        const rawRebate = r.threshold * r.rate;
        const capped    = Math.min(rawRebate, DAILY_REBATE_CAP);
        return {
          tier: r.tier,
          threshold: r.threshold,
          rate: r.rate,
          exampleBet:    r.threshold,
          exampleRebate: Math.round(capped),
          isBadge: r.threshold >= BADGE_THRESHOLD,  // 50k+ tiers earn the badge
        };
      });
    }

    function updateCountdown() {
      const now = Date.now();
      const pill = document.getElementById("countdown-pill");
      const timeEl = document.getElementById("countdown-pill-time");
      const labelEl = document.getElementById("countdown-pill-label");
      if (!pill || !timeEl || !labelEl) return;

      // T2: Ended
      if (now > ACTIVITY_END_TS) {
        labelEl.textContent = t("countdownEnded");
        timeEl.textContent = "";
        pill.classList.add("ended");
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        return;
      }

      // T1: Running (or pre-start — still counts down to END_TS regardless)
      pill.classList.remove("ended");
      labelEl.textContent = t("countdownLabel");

      let diff = Math.floor((ACTIVITY_END_TS - now) / 1000);
      if (diff < 0) diff = 0;
      const d = Math.floor(diff / 86400); diff -= d * 86400;
      const h = Math.floor(diff / 3600);  diff -= h * 3600;
      const m = Math.floor(diff / 60);    diff -= m * 60;
      const s = diff;
      const pad = (n) => String(n).padStart(2, "0");

      // Format: 2d 03h 45m 12s (omit days if 0)
      const dUnit = t("countdownDays");
      const hUnit = t("countdownHours");
      const mUnit = t("countdownMins");
      const sUnit = t("countdownSecs");
      const parts = [];
      if (d > 0) parts.push(`${d}${dUnit}`);
      parts.push(`${pad(h)}${hUnit}`);
      parts.push(`${pad(m)}${mUnit}`);
      parts.push(`${pad(s)}${sUnit}`);
      timeEl.textContent = parts.join(" ");
    }
    function startCountdown() {
      updateCountdown();
      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(updateCountdown, 1000);
    }

    /* ═══════════════════════════════════════════════════
       Render: Badge Card
    ═══════════════════════════════════════════════════ */
    /* ═══════════════════════════════════════════════════
       Render: 🏆 Achievement Card (Badge + Cumulative merged)

       Status logic (3 states):
         A "locked":  !is_old_badge_holder && !is_badge_earned
         B "earned":  !is_old_badge_holder &&  is_badge_earned   (just achieved this campaign)
         C "owned":    is_old_badge_holder                       (long-time holder)

       Data source caveat (important!):
         The BFF response does NOT expose `is_old_badge_holder` at the top level —
         only inside `today` and each `records[i]`. We must aggregate across both.
         A user who is an old-badge holder but hasn't bet today still has
         `is_old_badge_holder=true` in their settled records.
    ═══════════════════════════════════════════════════ */

    /** Resolve "is old badge holder" by scanning today + records. */
    function resolveIsOldBadgeHolder(data) {
      if (!data) return false;
      if (data.today && data.today.is_old_badge_holder) return true;
      if (Array.isArray(data.records)) {
        for (const r of data.records) {
          if (r && r.is_old_badge_holder) return true;
        }
      }
      return false;
    }

    function renderAchievement(data) {
      const el = document.getElementById("achievement-card");
      el.classList.remove("hidden");

      const isOldBadge = resolveIsOldBadgeHolder(data);
      const justEarned = !!data.is_badge_earned;
      const cumulative = data.total_bet_cumulative || 0;
      const totalRebate = data.total_rebate || 0;
      const pct = Math.min(100, (cumulative / BADGE_THRESHOLD) * 100);

      // Resolve state
      let state;
      if (isOldBadge) {
        state = "owned";              // C / D
      } else if (justEarned) {
        state = "earned";             // B
      } else {
        state = "locked";             // A
      }

      // Status chip + sub line + progress class
      let chipText, subText, subClass, progressFillClass;
      switch (state) {
        case "owned":
          chipText = t("achievementOwnedChip");
          subText  = t("achievementOwnedSub");
          subClass = "owned";
          progressFillClass = "maxed";  // gold→gradient look even if cumulative < threshold
          break;
        case "earned":
          chipText = t("achievementEarnedChip");
          subText  = t("achievementEarnedSub");
          subClass = "earned";
          progressFillClass = "maxed";  // green gradient for just-earned milestone
          break;
        default:  // locked
          chipText = t("achievementLockedChip");
          subText  = t("achievementUnlock");
          subClass = "";
          progressFillClass = "";       // default gold gradient
      }

      // Make whole card clickable -> open badge modal
      el.setAttribute("role", "button");
      el.setAttribute("tabindex", "0");
      el.setAttribute("aria-label", t("badgeSection"));
      el.onclick = openBadgeModal;
      el.onkeydown = (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openBadgeModal(); }
      };

      // Progress label gets a "not required" tag for owned state
      const progressLabelHtml = state === "owned"
        ? `${esc(t("achievementCumulativeBet"))}<span class="achievement-not-required">${esc(t("achievementNotRequired"))}</span>`
        : esc(t("achievementCumulativeBet"));

      // For owned/earned states, cap displayed progress at 100% visually
      const displayCumulative = Math.min(cumulative, BADGE_THRESHOLD);
      const displayPct = (state === "owned" || state === "earned") ? 100 : pct;

      el.innerHTML = `
        <div class="achievement-head">
          <div class="achievement-badge-wrap">
            <img src="${esc(BADGE_SVG_URL)}"
                 alt="${esc(t("badgeSection"))}"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span class="achievement-badge-fallback" style="display:none">🏆</span>
          </div>
          <div class="achievement-text">
            <div class="achievement-name">
              <span>${esc(t("badgeSection"))}</span>
              <span class="achievement-status-chip ${esc(state)}">${esc(chipText)}</span>
            </div>
            <div class="achievement-sub ${esc(subClass)}">
              ${esc(subText)}
            </div>
          </div>
          <div class="achievement-arrow" aria-hidden="true">›</div>
        </div>

        <div class="achievement-stats">
          <div class="achievement-stat-row">
            <div class="achievement-stat-label-row">
              <span class="achievement-stat-label">${progressLabelHtml}</span>
              <span class="achievement-stat-value">
                ${esc(fmtNum(displayCumulative))} / ${esc(fmtNum(BADGE_THRESHOLD))} ${esc(t("diamond"))}
              </span>
            </div>
            <div class="achievement-progress-track">
              <div class="achievement-progress-fill ${esc(progressFillClass)}" style="width:${displayPct.toFixed(1)}%"></div>
            </div>
          </div>

          <div class="achievement-divider"></div>

          <div class="achievement-stat-row">
            <div class="achievement-stat-label-row">
              <span class="achievement-stat-label">${esc(t("achievementCumulativeRebate"))}</span>
              <span class="achievement-stat-value teal">
                ${esc(fmtNum(totalRebate))} ${esc(t("diamond"))}
              </span>
            </div>
          </div>
        </div>
      `;
    }

    function renderBadgeCard(data) { renderAchievement(data); }

    /* ═══════════════════════════════════════════════════
       Badge Modal (Anime-style)
    ═══════════════════════════════════════════════════ */
    function openBadgeModal() {
      const scrim = document.getElementById("badge-modal-scrim");
      const hero  = document.getElementById("badge-modal-hero");
      const data  = apiData || {};
      const isOldBadge = resolveIsOldBadgeHolder(data);
      const justEarned = !!data.is_badge_earned;
      const cumulative = data.total_bet_cumulative || 0;
      const pct        = Math.min(100, (cumulative / BADGE_THRESHOLD) * 100);

      // Resolve 3-state (consistent with renderAchievement)
      let state;
      if (isOldBadge) state = "owned";
      else if (justEarned) state = "earned";
      else state = "locked";

      // Per spec: badge artwork always rendered in earned (full color + halo) style.
      hero.className = "badge-modal-hero";
      hero.innerHTML = `
        <img src="${esc(BADGE_SVG_URL)}"
             alt="${esc(t("badgeModalTitle"))}"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="badge-modal-fallback" style="display:none">🏆</span>
      `;

      // Title & section labels
      document.getElementById("badge-modal-title").textContent      = t("badgeModalTitle");
      document.getElementById("badge-modal-how-label").textContent  = t("badgeModalHowLabel");
      document.getElementById("badge-modal-how-body").textContent   = t("badgeModalHow");
      document.getElementById("badge-modal-progress-label").textContent = t("badgeModalProgress");

      // Status pill (3-state)
      const statusEl   = document.getElementById("badge-modal-status");
      const statusText = document.getElementById("badge-modal-status-text");
      // Clear previous state classes
      statusEl.classList.remove("owned", "earned", "locked");
      statusEl.classList.add(state);
      switch (state) {
        case "owned":  statusText.textContent = t("achievementOwnedChip"); break;
        case "earned": statusText.textContent = t("achievementEarnedChip"); break;
        default:       statusText.textContent = t("achievementLockedChip");
      }

      // Progress (display logic mirrors achievement card)
      const displayCumulative = Math.min(cumulative, BADGE_THRESHOLD);
      const displayPct = (state === "owned" || state === "earned") ? 100 : pct;
      document.getElementById("badge-modal-progress-current").textContent = fmtNum(displayCumulative);
      document.getElementById("badge-modal-progress-threshold").textContent =
        "/ " + fmtNum(BADGE_THRESHOLD) + " " + t("diamond");
      const fillEl = document.getElementById("badge-modal-progress-fill");

    /* ═══════════════════════════════════════════════════

    ═══════════════════════════════════════════════════ */
    function renderRecords(records, totalRebate) {
      const section = document.getElementById("section-records");
      const content = document.getElementById("records-content");
      const noRec   = document.getElementById("no-records");
      const chip    = document.getElementById("total-rebate-chip");

      // Per spec: if no settled records, hide the entire section.
      if (!records || records.length === 0) {
        section.classList.add("hidden");
        return;
      }

      // Has data → show section
      section.classList.remove("hidden");
      noRec.classList.add("hidden");
      content.classList.remove("hidden");

      if (totalRebate > 0) {
        chip.style.display = "";
        chip.textContent = t("totalRebate", { n: fmtNum(totalRebate) });
      }

      content.innerHTML = records.map((rec, idx) => {
        const tier     = rec.user_level || "none";
        const meta     = TIER_META[tier] || TIER_META.none;
        const dayNum   = getDayNum(rec.bet_date);
        const dateDisp = formatDisplayDate(rec.bet_date);
        const isCapped = (rec.daily_rebate_amount || 0) >= 10000;
        const bonusOn  = !!rec.is_daily_bonus_triggered;
        const isOldBadge = !!rec.is_old_badge_holder;

        return `
          <div class="record-card" style="animation-delay:${idx * 0.07}s">
            <div class="record-header">
              <div class="record-date">${esc(t("day", { n: dayNum }))} · ${esc(dateDisp)}</div>
              <div class="record-tier-chip ${esc(meta.color)}">

              </div>
            </div>
            <div class="record-stats">
              <div class="record-stat">
                <div class="record-stat-label">${esc(t("dailyBet"))}</div>
                <div class="record-stat-value">${esc(fmtNum(rec.daily_bet || 0))}</div>
              </div>
              <div class="record-stat">
                <div class="record-stat-label">${esc(t("rate"))}</div>
                <div class="record-stat-value teal">${rec.final_rebate_rate ? (rec.final_rebate_rate * 100).toFixed(1) + "%" : "—"}</div>
              </div>
              <div class="record-stat">
                <div class="record-stat-label">${esc(t("settledRebate"))}</div>
                <div class="record-stat-value teal">
                  ${esc(fmtNum(rec.daily_rebate_amount || 0))}
                  ${isCapped ? `<span style="font-size:10px;color:var(--tier-gold-color);margin-left:2px">▲</span>` : ""}
                </div>
              </div>
              <div class="record-stat">
                <div class="record-stat-label">${esc(t("rank"))}</div>
                <div class="record-stat-value">${rec.daily_rank ? esc(fmtNum(rec.daily_rank)) + esc(t("rank_unit")) : "—"}</div>
              </div>
            </div>
            ${bonusOn ? `<div class="record-bonus-tag">⚡ ${esc(t("bonusActiveBanner").replace(/^✨\s*/, ""))}</div>` : ""}
            ${isOldBadge ? `<div class="record-old-badge-tag">${esc(t("oldBadgeRecordTag"))}</div>` : ""}
          </div>
        `;
      }).join("");
    }

       Render All (after data arrives)
    ═══════════════════════════════════════════════════ */
    function renderAll(data) {
      apiData = data;

      // Hide all skeletons (records section starts hidden by default — no skeleton needed)
      const hideSkel = (id) => {
        const el = document.getElementById(id);
        if (el) el.classList.add("hidden");
      };
      hideSkel("skeleton-hero");
      hideSkel("skeleton-summary");
      hideSkel("skeleton-badge");

      // Render Hero first (it figures out phase & shows the right card)
      renderHero(data.today);

      // T2: hide status (today's stats are stale), keep achievement (badge result is meaningful)
      const phase = getActivityPhase();
      const statusSection      = document.getElementById("section-status");
      const achievementSection = document.getElementById("section-achievement");
      if (phase === "ended") {
        statusSection.classList.add("hidden");
        achievementSection.classList.remove("hidden");
        renderAchievement(data);
      } else {
        // T1 (running): show both
        statusSection.classList.remove("hidden");
        achievementSection.classList.remove("hidden");
        renderStatus(data);
        renderAchievement(data);
      }

      renderRecords(data.records, data.total_rebate);

      applyLangStatic();
    }

    /* ═══════════════════════════════════════════════════
       API
    ═══════════════════════════════════════════════════ */
    async function fetchStatus(tok) {
      const res = await fetch(`${API_BASE}/my-status`, {
        headers: {
          "Authorization": `Bearer ${tok}`,
          "Content-Type":  "application/json",
        }
      });

      if (!res.ok) {
        handleApiError(res.status);
        return;
      }

      const data = await res.json();
      renderAll(data);
    }

    function handleApiError(status) {
      const msgs = {
        403: "您不符合本活動參與資格",
        409: "您已完成此操作",
        429: "請求過於頻繁，請稍後再試",
        500: "系統暫時不穩定，請稍後重新整理",
      };
      const msg = msgs[status] || `Error ${status}`;

      // Hide skeletons
      ["skeleton-hero","skeleton-summary","skeleton-badge"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add("hidden");
      });

      // U4: 403 → not eligible. Hide bottom fixed CTA to avoid encouraging
      // a user who won't earn rebate to keep gambling.
      if (status === 403) {
        document.body.classList.add("hide-fixed-cta");
      }

      // Show error message
      const errDiv = document.createElement("div");
      errDiv.style.cssText = "text-align:center;padding:40px 16px;color:var(--color-on-primary-3);font-size:14px;";
      errDiv.textContent = msg;
      const heroSection = document.getElementById("section-hero");
      if (heroSection) heroSection.appendChild(errDiv);
    }

    /* ═══════════════════════════════════════════════════
       Dev Mode

       To preview different states, append URL params:
       - ?phase=running    → T1 normal flow (default)
       - ?phase=ended      → T2 final summary

       The MOCK_DATA below simulates a typical "running + bet placed" user.
       Edit MOCK_DATA to simulate U0/U2/U3/U4 scenarios:
       - U0 no-bet today:     set today: null
       - U2 cap reached:      set today.daily_rebate_amount: 10000
       - U3 old-badge no-bet: set today: null + records[i].is_old_badge_holder: true
       - U4 not eligible:     call handleApiError(403) instead of renderAll
    ═══════════════════════════════════════════════════ */

    // SWAG Web fallback URL: opened when user can't get a token (outside iframe, or
    // handshake times out). Adding action=login asks SWAG to auto-show login prompt.
    const SWAG_LOGIN_URL = "https://swag.live/iframe/?source=https://events.swag.app/rebate_v2&title=iframe_viewer_header&action=login";

    // Dev Mode = page opened directly on the developer's machine (file:// or localhost).
    //   - file://       → local file double-clicked
    //   - localhost     → local dev server
    //   - 127.0.0.1     → local dev server (alt)
    // Anything else opened outside an iframe is treated as "external access" by a
    // real user (deep link, shared URL, etc.) and will be redirected to SWAG.
    const isDevMode = (
      window.self === window.top && (
        window.location.protocol === "file:" ||
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
      )
    );

    // External access = real user opened the page outside iframe (non-dev).
    // Trigger immediate "device not supported" fallback (no need to wait 30s).
    const isExternalAccess = (window.self === window.top) && !isDevMode;

    const MOCK_DATA = {
      today: {

    /* ═══════════════════════════════════════════════════
       postMessage Protocol (SWAG Iframe)

       Handshake strategy:
       - Send IFRAME_READY + REQUEST_TOKEN immediately + at exponential intervals
       - Show "still connecting…" hint after 3s
       - Show "taking longer than usual" hint after 10s
       - Show graceful degradation card after 30s
       - Pause retries while page is hidden, resume when visible again
       - Origin validation deferred to host site (per spec); only validate message shape
    ═══════════════════════════════════════════════════ */

    // Handshake retry schedule (cumulative ms from page load): exponential then linear
    const HANDSHAKE_SCHEDULE = [100, 1000, 2500, 5000, 10000];
    const HANDSHAKE_LINEAR_INTERVAL = 5000;   // after schedule exhausted, retry every 5s
    const HANDSHAKE_SOFT_HINT_AT   = 3000;    // show "connecting…" hint
    const HANDSHAKE_URGENT_HINT_AT = 10000;   // upgrade hint to "taking longer"
    const HANDSHAKE_TIMEOUT_MS     = 30000;   // give up and show fallback

    let handshakeStartTime = 0;
    let handshakeTimers   = [];   // pending setTimeout ids
    let handshakeLinear   = null; // setInterval id after schedule done
    let handshakeFailed   = false;

    function sendReady() {
      try {
        // Send both IFRAME_READY (standard) and REQUEST_TOKEN (for passive hosts like ramen)
        window.parent.postMessage({ type: "IFRAME_READY" }, "*");
        window.parent.postMessage({ type: "REQUEST_TOKEN" }, "*");
      } catch (_) { /* may fail in same-origin sandbox; ignore */ }
    }

    function showConnectingHint(level) {
      const el = document.getElementById("connecting-hint");
      const textEl = document.getElementById("connecting-hint-text");
      if (!el || !textEl) return;
      el.classList.remove("hidden");
      if (level === "urgent") {
        el.classList.add("urgent");
        textEl.textContent = t("connectingSlow");
      } else {
        el.classList.remove("urgent");
        textEl.textContent = t("connectingHint");
      }
    }
    function hideConnectingHint() {
      const el = document.getElementById("connecting-hint");
      if (el) el.classList.add("hidden");
    }

    function showConnectionFailed() {
      handshakeFailed = true;
      stopHandshakeRetries();
      hideConnectingHint();
      // Hide skeleton + all hero states; show only failure card
      ["skeleton-hero", "hero-card", "hero-no-bet", "hero-final-summary"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add("hidden");
      });
      const failEl = document.getElementById("hero-connection-failed");
      if (failEl) failEl.classList.remove("hidden");
      // Apply i18n texts
      document.getElementById("connection-failed-title").textContent = t("connectionFailedTitle");
      document.getElementById("connection-failed-sub").textContent   = t("connectionFailedSub");
      document.getElementById("connection-retry-text").textContent   = t("connectionRetryBtn");
      document.getElementById("connection-rules-text").textContent   = t("connectionRulesBtn");
      // Also hide the bottom CTA — without a token, "go play" implies token-protected flow
      document.body.classList.add("hide-fixed-cta");
    }

    function startHandshakeRetries() {
      stopHandshakeRetries();
      handshakeStartTime = Date.now();
      handshakeFailed = false;

      // Schedule the exponential retries
      HANDSHAKE_SCHEDULE.forEach(delay => {
        const tid = setTimeout(() => {
          if (token || handshakeFailed) return;
          sendReady();
        }, delay);
        handshakeTimers.push(tid);
      });

      // After last scheduled retry, fall back to linear interval
      const lastScheduled = HANDSHAKE_SCHEDULE[HANDSHAKE_SCHEDULE.length - 1];
      const linearStartTid = setTimeout(() => {
        if (token || handshakeFailed) return;
        handshakeLinear = setInterval(() => {
          if (token || handshakeFailed) {
            clearInterval(handshakeLinear);
            handshakeLinear = null;
            return;
          }
          sendReady();
        }, HANDSHAKE_LINEAR_INTERVAL);
      }, lastScheduled + HANDSHAKE_LINEAR_INTERVAL);
      handshakeTimers.push(linearStartTid);

      // Soft hint at 3s, urgent hint at 10s, hard failure at 30s
      handshakeTimers.push(setTimeout(() => {
        if (!token && !handshakeFailed) showConnectingHint("soft");
      }, HANDSHAKE_SOFT_HINT_AT));
      handshakeTimers.push(setTimeout(() => {
        if (!token && !handshakeFailed) showConnectingHint("urgent");
      }, HANDSHAKE_URGENT_HINT_AT));
      handshakeTimers.push(setTimeout(() => {
        if (!token && !handshakeFailed) showConnectionFailed();
      }, HANDSHAKE_TIMEOUT_MS));
    }

    function stopHandshakeRetries() {
      handshakeTimers.forEach(clearTimeout);
      handshakeTimers = [];
      if (handshakeLinear) {
        clearInterval(handshakeLinear);
        handshakeLinear = null;
      }
    }

    function onTokenReceived(receivedToken) {
      token = receivedToken;
      stopHandshakeRetries();
      hideConnectingHint();
      // Hide failure card if it was showing (e.g. token arrived very late)
      const failEl = document.getElementById("hero-connection-failed");
      if (failEl) failEl.classList.add("hidden");
      handshakeFailed = false;
      fetchStatus(token);
    }

    document.addEventListener("DOMContentLoaded", () => {
      applyLangStatic();
      startCountdown();

      // Refresh "updated X minutes ago" chip every 30s
      setInterval(() => {
        if (!apiData || !apiData.today || !apiData.today.calculated_at) return;
        const el = document.getElementById("hero-updated-text");
        if (el) {
          el.textContent = t("updatedAt", { n: relativeTimeFromNow(apiData.today.calculated_at) });
        }
      }, 30000);

      // Wire connection-failed card buttons
      const retryBtn = document.getElementById("connection-retry-btn");
      if (retryBtn) {
        retryBtn.addEventListener("click", () => {
          // If inside iframe, ask parent to navigate (consistent with PWA nav interceptor).
          // Otherwise navigate directly in current window.
          if (window.self !== window.top) {
            try {
              window.parent.postMessage({ type: "PWA_NAVIGATE", url: SWAG_LOGIN_URL }, "*");
              return;
            } catch (_) { /* fall through to direct navigation */ }
          }
          window.location.href = SWAG_LOGIN_URL;
        });
      }
      const rulesFallbackBtn = document.getElementById("connection-rules-btn");
      if (rulesFallbackBtn) {
        rulesFallbackBtn.addEventListener("click", openRulesModal);
      }

      // External access (non-iframe, non-dev): immediately show failure card.
      // No point waiting 30s for a token that can never arrive in this context.
      if (isExternalAccess) {
        showConnectionFailed();
        return;
      }

      if (!isDevMode) {
        // First send immediately, then start the retry schedule
        sendReady();
        startHandshakeRetries();
      }
    });

    // Listen for token messages
    window.addEventListener("message", (event) => {
      // Validate message shape (Q2 spec: origin validation delegated to host site;
      // we still defensively check the payload itself.)
      const data = event.data;
      if (!data || typeof data !== "object" || typeof data.type !== "string") return;

      if (data.type === "SET_TOKEN") {
        const receivedToken = data.token;
        if (typeof receivedToken !== "string" || !receivedToken) return;
        // Length sanity (real SWAG tokens are ~524 chars; reject obvious garbage)
        if (receivedToken.length < 20 || receivedToken.length > 4096) return;
        if (receivedToken === token) return;  // dedupe identical
        onTokenReceived(receivedToken);
      }
    });

    // Pause retries when tab hidden, resume on return
    document.addEventListener("visibilitychange", () => {
      if (token || isDevMode) return;
      if (document.hidden) {
        // Going to background: pause retries to save battery / network
        stopHandshakeRetries();
      } else if (!handshakeFailed) {
        // Coming back to foreground: try once immediately, then resume schedule
        sendReady();
        startHandshakeRetries();
      }
    });

    /* ═══════════════════════════════════════════════════
       PWA Navigation Interceptor
    ═══════════════════════════════════════════════════ */
    document.addEventListener("click", (e) => {
      const link = e.target.closest("a[target='_blank']");
      if (!link || window.self === window.top) return;
      try {
        const url = new URL(link.href);
        if (["swag.live", "www.swag.live"].includes(url.hostname)) {

        }
      } catch (_) {}
    });
  </script>
