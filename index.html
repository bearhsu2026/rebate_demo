<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>博弈遊戲王 ─ 玩直播間遊戲 天天領鑽石</title>
  <style>
    /* ═══════════════════════════════════════════════════
       SWAG Design Tokens (完整範本)
    ═══════════════════════════════════════════════════ */
    :root {
      --color-primary:              #00D2BE;
      --color-primary-hover:        rgba(0,210,190,0.80);
      --color-primary-pressed:      rgba(0,210,190,0.40);
      --color-primary-disabled:     rgba(71,71,71,0.20);
      --color-text-primary:         #00D2BE;
      --color-text-info:            #60C4E8;
      --color-text-error:           #CF0404;
      --color-on-primary-1:         #FFFFFF;
      --color-on-primary-2:         #C8C8C8;
      --color-on-primary-3:         #646464;
      --color-on-primary-disabled:  rgba(255,255,255,0.40);
      --color-surface:              #191919;
      --color-surface-container:    #232323;
      --color-surface-variant:      rgba(71,71,71,0.40);
      --color-outline:              #474747;
      --color-outline-variant:      rgba(71,71,71,0.40);
      --color-outline-brand:        #00D2BE;
      --color-scrim:                rgba(25,25,25,0.80);
      --color-shadow:               rgba(25,25,25,0.20);
      --color-success:              #00D2BE;
      --color-error:                #CF0404;
      --color-info:                 #60C4E8;
      --color-secondary:            #FFFFFF;
      --color-tertiary:             #474747;
      --color-null-hover:           rgba(255,255,255,0.12);
      --color-creator:              #FFD100;
      --color-loverse:              #F6418D;
      --color-asset:                #8238BA;
      --color-preset-orange:        #FF7200;
      --color-preset-gold:          #FFA500;
      --color-preset-green:         #15EA48;
      --color-preset-pink:          #F6418D;
      --color-preset-purple:        #8238BA;

      --font-family:                'PingFang TC', -apple-system, sans-serif;
      --font-weight-regular:        400;
      --font-weight-semibold:       600;
      --font-headline-large:        36px;
      --font-headline-medium:       32px;
      --font-headline-small:        28px;
      --font-title-large:           22px;
      --font-title-medium:          20px;
      --font-title-small:           18px;
      --font-body-large:            16px;
      --font-body-medium:           14px;
      --font-body-small:            12px;

      --spacing-1: 2px;  --spacing-2: 4px;   --spacing-3: 8px;
      --spacing-4: 12px; --spacing-5: 16px;  --spacing-6: 24px;
      --spacing-7: 32px; --spacing-8: 40px;  --spacing-9: 48px;
      --spacing-10: 64px;

      --radius-xs: 4px; --radius-s: 8px;  --radius-m: 12px;
      --radius-l: 16px; --radius-xl: 28px; --radius-full: 1000px;

      --container-standard: 480px;
      --page-padding: var(--spacing-5);

      /* ── 活動專屬 Tier 色彩 (基於 SWAG token 值) ── */
      --tier-bronze-color:   var(--color-preset-orange);
      --tier-silver-color:   var(--color-on-primary-2);
      --tier-gold-color:     var(--color-creator);
      --tier-diamond-color:  var(--color-primary);

      --tier-bronze-glow:    rgba(255,114,0,0.25);
      --tier-silver-glow:    rgba(200,200,200,0.20);
      --tier-gold-glow:      rgba(255,209,0,0.25);
      --tier-diamond-glow:   rgba(0,210,190,0.25);
    }

    /* ═══════════════════════════════════════════════════
       Base
    ═══════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
      /* Firefox scrollbar (rgba unsupported in some FF versions, so use solid colors close to teal/purple) */
      scrollbar-width: thin;
      scrollbar-color: #4a2380 #1c0a47;
    }

    body {
      font-family: var(--font-family);
      font-size: var(--font-body-large);
      font-weight: var(--font-weight-regular);
      color: var(--color-on-primary-1);
      background-color: var(--color-surface);
      min-height: 100vh;
      padding-bottom: var(--spacing-10);
      overflow-x: hidden;
      max-width: 100vw;
    }

    /* WebKit (Chrome / Safari / Edge / mobile) scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(28, 10, 71, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #8238BA 0%, #5a2493 100%);
      border-radius: 8px;
      border: 1px solid rgba(0,210,190,0.3);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #9a4ed1 0%, #6e2faa 100%);
    }
    /* Lock horizontal scroll inside any potentially overflowing element */
    .page-content,
    .header {
      max-width: 100vw;
      overflow-x: clip;
    }

    .hidden { display: none !important; }

    /* ═══════════════════════════════════════════════════
       Language Switcher
    ═══════════════════════════════════════════════════ */
    .lang-switcher {
      position: fixed;
      top: var(--spacing-3);
      right: var(--spacing-4);
      z-index: 999;
      display: flex;
      gap: var(--spacing-1);
      background: rgba(25,25,25,0.85);
      border: 1px solid rgba(0,210,190,0.30);
      border-radius: var(--radius-full);
      padding: var(--spacing-1) var(--spacing-2);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 12px rgba(0,210,190,0.15);
    }
    .lang-btn {
      background: none;
      border: none;
      color: var(--color-on-primary-3);
      font-size: var(--font-body-small);
      font-family: var(--font-family);
      cursor: pointer;
      padding: var(--spacing-1) var(--spacing-2);
      border-radius: var(--radius-full);
      transition: color 0.2s, background 0.2s;
      white-space: nowrap;
    }
    .lang-btn.active,
    .lang-btn:hover {
      color: var(--color-on-primary-1);
      background: var(--color-surface-variant);
    }
    .lang-btn.active {
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
    }

    /* ═══════════════════════════════════════════════════
       Header (Purple Cosmos Theme — game prize vibe)
    ═══════════════════════════════════════════════════ */
    .header {
      position: relative;
      padding: calc(var(--spacing-9) + 8px) var(--page-padding) var(--spacing-8);
      text-align: center;
      background:
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(0,210,190,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(246,65,141,0.20) 0%, transparent 60%),
        radial-gradient(ellipse 80% 50% at 80% 30%, rgba(255,114,0,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 100% 80% at 50% 0%, rgba(130,56,186,0.55) 0%, transparent 70%),
        linear-gradient(180deg, #2a1066 0%, #3b1a87 30%, #2c1166 60%, #1c0a47 100%);
      border-bottom: 1px solid var(--color-outline-variant);
      overflow: hidden;
    }
    /* Starfield (denser stars on space theme) */
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 8% 15%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 18% 35%, rgba(255,255,255,0.85) 0%, transparent 100%),
        radial-gradient(1px 1px at 28% 22%, #fff 0%, transparent 100%),
        radial-gradient(2px 2px at 42% 12%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 38%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 62% 25%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 72% 48%, rgba(255,255,255,0.85) 0%, transparent 100%),
        radial-gradient(1px 1px at 86% 18%, #fff 0%, transparent 100%),
        radial-gradient(2px 2px at 95% 38%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 14% 60%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 36% 72%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 58% 65%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 82% 82%, rgba(255,255,255,0.7) 0%, transparent 100%);
      animation: twinkle 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }

    /* Decorative cosmos layer (planets/coins/diamonds) */
    .header-deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

    /* Planet — Saturn-like with ring (top-left) */
    .deco-planet-saturn {
      position: absolute;
      top: -10px; left: -12px;
      width: 90px; height: 90px;
      animation: float-slow 7s ease-in-out infinite;
      opacity: 0.85;
    }
    .deco-planet-saturn .ball {
      position: absolute; inset: 12% 18% 28% 12%;
      background: radial-gradient(circle at 35% 35%, #ff8c4a 0%, #d65a1f 50%, #8a3300 100%);
      border-radius: 50%;
      box-shadow: inset -6px -6px 12px rgba(0,0,0,0.4);
    }
    .deco-planet-saturn .ring {
      position: absolute; top: 38%; left: -8%; right: -8%; height: 14px;
      border: 3px solid #ff7a3c;
      border-radius: 50%;
      transform: rotate(-18deg);
      box-shadow: 0 0 14px rgba(255,114,0,0.5);
      opacity: 0.85;
    }
    .deco-planet-saturn .ring::before {
      content: '';
      position: absolute; inset: 2px;
      border: 2px solid rgba(255,180,120,0.55);
      border-radius: 50%;
    }

    /* Planet — purple moon (top-right) */
    .deco-planet-moon {
      position: absolute;
      top: -16px; right: -12px;
      width: 70px; height: 70px;
      background: radial-gradient(circle at 35% 35%, #c69df0 0%, #9a5fd6 55%, #5a2ea3 100%);
      border-radius: 50%;
      box-shadow:
        inset -8px -8px 18px rgba(0,0,0,0.45),
        0 0 24px rgba(154,95,214,0.5);
      animation: float-slow 8s ease-in-out infinite reverse;
      opacity: 0.9;
    }
    .deco-planet-moon::before,
    .deco-planet-moon::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(60,20,110,0.5);
    }
    .deco-planet-moon::before { top: 30%; left: 22%; width: 12px; height: 12px; }
    .deco-planet-moon::after  { top: 58%; left: 48%; width: 8px;  height: 8px; }

    @keyframes float-slow {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(8px); }
    }

    /* Floating diamonds (now teal/cyan, varied sizes) */
    .deco-diamond {
      position: absolute;
      width: 18px; height: 18px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, rgba(0,210,190,0.85) 0%, rgba(0,210,190,0.25) 100%);
      border: 1px solid rgba(0,210,190,0.9);
      border-radius: 3px;
      box-shadow: 0 0 14px rgba(0,210,190,0.6);
      animation: float-diamond 5s ease-in-out infinite;
    }
    .deco-diamond.d1 { top: 24%;  left: 9%;   animation-delay: 0s;   }
    .deco-diamond.d2 { top: 14%;  left: 42%;  width: 12px; height: 12px; animation-delay: 1.0s; opacity: 0.75; }
    .deco-diamond.d3 { top: 26%;  right: 14%; width: 14px; height: 14px; animation-delay: 1.7s; opacity: 0.85; }
    .deco-diamond.d4 { top: 60%;  right: 8%;  width: 11px; height: 11px; animation-delay: 2.6s; opacity: 0.7; }
    .deco-diamond.d5 { top: 72%;  left: 14%;  width: 10px; height: 10px; animation-delay: 0.6s; opacity: 0.6; }
    @keyframes float-diamond {
      0%, 100% { transform: rotate(45deg) translateY(0); }
      50%      { transform: rotate(45deg) translateY(-8px); }
    }

    /* Gold coins floating */
    .deco-coin {
      position: absolute;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff3a0 0%, #ffd100 40%, #cc9a00 100%);
      border: 2px solid #ffe566;
      box-shadow: 0 0 12px rgba(255,209,0,0.55), inset -3px -3px 6px rgba(0,0,0,0.25);
      animation: coin-float 6s ease-in-out infinite;
    }
    .deco-coin::after {
      content: '★';
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(204,154,0,0.85);
      font-size: 14px;
      font-weight: 900;
    }
    .deco-coin.c1 { top: 46%; left: 4%;   animation-delay: 0s; }
    .deco-coin.c2 { top: 78%; right: 6%;  width: 22px; height: 22px; animation-delay: 1.5s; }
    .deco-coin.c2::after { font-size: 11px; }
    @keyframes coin-float {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50%      { transform: translateY(-10px) rotate(8deg); }
    }

    /* Day badge (more prominent purple pill) */
    .day-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-2);
      background: linear-gradient(180deg, rgba(130,56,186,0.65), rgba(60,20,110,0.55));
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: var(--radius-full);
      padding: var(--spacing-2) var(--spacing-5);
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      margin-bottom: var(--spacing-4);
      position: relative;
      backdrop-filter: blur(4px);
      box-shadow:
        0 0 24px rgba(130,56,186,0.55),
        inset 0 1px 0 rgba(255,255,255,0.25);
      letter-spacing: 0.04em;
    }
    .day-badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
      box-shadow: 0 0 8px var(--color-primary);
      animation: pulse-dot 1.8s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.7); }
    }

    /* Title (larger, with stronger glow like the reference image) */
    .activity-title {
      font-size: var(--font-headline-large);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      line-height: 1.1;
      margin-bottom: var(--spacing-3);
      position: relative;
      letter-spacing: 0.06em;
      text-shadow:
        0 0 24px rgba(255,255,255,0.6),
        0 0 40px rgba(130,56,186,0.8),
        0 0 60px rgba(246,65,141,0.5),
        0 2px 8px rgba(0,0,0,0.6);
    }

    /* Subtitle pill */
    .activity-subtitle {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-2);
      background: linear-gradient(90deg, rgba(0,210,190,0.20), rgba(246,65,141,0.20));
      border: 1px solid rgba(255,255,255,0.30);
      border-radius: var(--radius-full);
      padding: var(--spacing-2) var(--spacing-5);
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      margin-bottom: var(--spacing-4);
      position: relative;
      letter-spacing: 0.02em;
      backdrop-filter: blur(4px);
    }
    .activity-subtitle::before,
    .activity-subtitle::after {
      content: '◆';
      color: var(--color-primary);
      font-size: 10px;
      opacity: 0.9;
    }

    .activity-dates {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-2);
      letter-spacing: 0.08em;
      margin-bottom: var(--spacing-4);
      position: relative;
      opacity: 0.85;
    }
    .activity-tz {
      display: inline-block;
      margin-left: var(--spacing-1);
      padding: 1px 6px;
      border-radius: var(--radius-xs);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 10px;
      color: var(--color-on-primary-2);
      letter-spacing: 0.04em;
      vertical-align: middle;
    }

    .games-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: var(--spacing-2);
      position: relative;
    }
    .game-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(25,15,50,0.55);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: var(--radius-full);
      padding: 3px 10px 3px 4px;   /* slightly tighter left to make room for image */
      font-size: var(--font-body-small);
      color: var(--color-on-primary-1);
      backdrop-filter: blur(4px);
      max-width: 100%;
    }
    .game-tag-img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.18);
    }

    /* ═══════════════════════════════════════════════════
       Page Content
    ═══════════════════════════════════════════════════ */
    .page-content {
      max-width: var(--container-standard);
      margin: 0 auto;
      padding: var(--spacing-6) var(--page-padding) 0;
    }

    .section { margin-bottom: var(--spacing-5); }

    .section-title {
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: var(--spacing-3);
    }

    /* ═══════════════════════════════════════════════════
       Skeleton Loading
    ═══════════════════════════════════════════════════ */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton-card {
      background: var(--color-surface-container);
      border-radius: var(--radius-l);
      padding: var(--spacing-6);
      border: 1px solid var(--color-outline-variant);
    }
    .skel-line {
      height: 14px;
      border-radius: var(--radius-xs);
      background: linear-gradient(90deg,
        var(--color-surface-variant) 25%,
        rgba(71,71,71,0.6) 50%,
        var(--color-surface-variant) 75%);
      background-size: 400px 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      margin-bottom: var(--spacing-3);
    }
    .skel-line.wide   { width: 70%; }
    .skel-line.medium { width: 50%; }
    .skel-line.short  { width: 35%; }
    .skel-row { display: flex; gap: var(--spacing-3); margin-top: var(--spacing-5); }
    .skel-block {
      flex: 1; height: 56px;
      border-radius: var(--radius-s);
      background: linear-gradient(90deg,
        var(--color-surface-variant) 25%,
        rgba(71,71,71,0.6) 50%,
        var(--color-surface-variant) 75%);
      background-size: 400px 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    .skel-block:nth-child(2) { animation-delay: 0.15s; }
    .skel-block:nth-child(3) { animation-delay: 0.30s; }

    /* ═══════════════════════════════════════════════════
       Today Card
    ═══════════════════════════════════════════════════ */
    .today-card {
      background:
        radial-gradient(ellipse 70% 50% at 0% 0%, rgba(130,56,186,0.10) 0%, transparent 60%),
        var(--color-surface-container);
      border-radius: var(--radius-l);
      border: 1px solid var(--color-outline);
      overflow: hidden;
      animation: fade-up 0.4s ease both;
      box-shadow:
        0 0 0 1px rgba(0,210,190,0.06),
        0 8px 24px -8px rgba(25,25,25,0.4);
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .today-tier-banner {
      padding: var(--spacing-5) var(--spacing-6) var(--spacing-4);
      display: flex;
      align-items: center;
      gap: var(--spacing-4);
      border-bottom: 1px solid var(--color-outline-variant);
    }
    .tier-icon-wrap {
      width: 56px; height: 56px;
      border-radius: var(--radius-m);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      position: relative;
    }
    .tier-icon-wrap::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      border: 1px solid currentColor;
      opacity: 0.5;
    }
    .tier-icon-wrap.bronze {
      background: rgba(255,114,0,0.12);
      color: var(--tier-bronze-color);
      box-shadow: 0 0 20px var(--tier-bronze-glow);
    }
    .tier-icon-wrap.silver {
      background: rgba(200,200,200,0.08);
      color: var(--tier-silver-color);
      box-shadow: 0 0 20px var(--tier-silver-glow);
    }
    .tier-icon-wrap.gold {
      background: rgba(255,209,0,0.10);
      color: var(--tier-gold-color);
      box-shadow: 0 0 20px var(--tier-gold-glow);
    }
    .tier-icon-wrap.diamond {
      background: rgba(0,210,190,0.10);
      color: var(--tier-diamond-color);
      box-shadow: 0 0 20px var(--tier-diamond-glow);
    }
    .tier-info { flex: 1; min-width: 0; }
    .tier-label {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
      margin-bottom: var(--spacing-1);
    }
    .tier-name {
      font-size: var(--font-title-medium);
      font-weight: var(--font-weight-semibold);
      line-height: 1;
      margin-bottom: var(--spacing-1);
    }
    .tier-rate {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-2);
    }
    .tier-rate strong { color: var(--color-primary); }

    .today-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-bottom: 1px solid var(--color-outline-variant);
    }
    .stat-cell {
      padding: var(--spacing-4) var(--spacing-3);
      text-align: center;
      border-right: 1px solid var(--color-outline-variant);
    }
    .stat-cell:last-child { border-right: none; }
    .stat-label {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
      margin-bottom: var(--spacing-1);
      line-height: 1.2;
    }
    .stat-value {
      font-size: var(--font-title-small);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-value.highlight { color: var(--color-primary); }
    .stat-value.gold-val  { color: var(--tier-gold-color); }

    .today-progress { padding: var(--spacing-4) var(--spacing-5); }
    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: var(--spacing-2);
    }
    .progress-label {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
    }
    .progress-hint {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
    }
    .progress-track {
      height: 6px;
      background: var(--color-surface-variant);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .progress-fill.bronze  { background: var(--tier-bronze-color); }
    .progress-fill.silver  { background: var(--tier-silver-color); }
    .progress-fill.gold    { background: var(--tier-gold-color); }
    .progress-fill.diamond { background: var(--tier-diamond-color); }
    .progress-fill.maxed   { background: var(--tier-diamond-color); }

    .bonus-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-3);
      padding: var(--spacing-3) var(--spacing-5);
      background: rgba(71,71,71,0.2);
      border-top: 1px solid var(--color-outline-variant);
      font-size: var(--font-body-small);
    }
    .bonus-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .bonus-dot.on  { background: var(--color-preset-green); box-shadow: 0 0 6px var(--color-preset-green); }
    .bonus-dot.off { background: var(--color-on-primary-3); }
    .bonus-text { color: var(--color-on-primary-2); flex: 1; }
    .bonus-count { color: var(--color-on-primary-3); font-size: var(--font-body-small); }

    .old-badge-note {
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
      padding: var(--spacing-2) var(--spacing-5);
      font-size: var(--font-body-small);
      color: var(--tier-gold-color);
      background: rgba(255,209,0,0.06);
      border-top: 1px solid rgba(255,209,0,0.15);
    }

    .no-today-card {
      background: var(--color-surface-container);
      border: 1px dashed var(--color-outline);
      border-radius: var(--radius-l);
      padding: var(--spacing-8) var(--spacing-6);
      text-align: center;
      animation: fade-up 0.4s ease both;
    }
    .no-today-icon { font-size: 40px; margin-bottom: var(--spacing-3); opacity: 0.5; }
    .no-today-title {
      font-size: var(--font-title-small);
      color: var(--color-on-primary-2);
      margin-bottom: var(--spacing-2);
    }
    .no-today-sub { font-size: var(--font-body-small); color: var(--color-on-primary-3); }

    /* ═══════════════════════════════════════════════════
       Badge Card
    ═══════════════════════════════════════════════════ */
    .badge-card {
      background:
        radial-gradient(ellipse 60% 60% at 100% 0%, rgba(130,56,186,0.08) 0%, transparent 60%),
        var(--color-surface-container);
      border-radius: var(--radius-l);
      border: 1px solid var(--color-outline);
      overflow: hidden;
      animation: fade-up 0.4s 0.1s ease both;
      box-shadow:
        0 0 0 1px rgba(255,209,0,0.05),
        0 8px 24px -8px rgba(25,25,25,0.4);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .badge-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,209,0,0.4);
      box-shadow:
        0 0 0 1px rgba(255,209,0,0.15),
        0 12px 28px -8px rgba(25,25,25,0.55);
    }
    .badge-card:active {
      transform: translateY(0);
      transition-duration: 0.1s;
    }
    .badge-inner {
      padding: var(--spacing-5) var(--spacing-6);
      display: flex;
      align-items: center;
      gap: var(--spacing-4);
    }
    .badge-icon-wrap {
      width: 56px; height: 56px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge-icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: filter 0.35s ease, transform 0.35s ease;
    }
    .badge-icon-wrap.earned img {
      filter: drop-shadow(0 0 10px rgba(255,209,0,0.55));
      animation: badge-breath 3s ease-in-out infinite;
    }
    .badge-icon-wrap.pending img {
      /* Per spec: badge always shown in full color, regardless of earned status.
         Differentiation is conveyed by the "Not yet earned" tag instead. */
      filter: drop-shadow(0 0 10px rgba(255,209,0,0.45));
    }
    .badge-card:hover .badge-icon-wrap img {
      transform: scale(1.06);
    }
    @keyframes badge-breath {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255,209,0,0.55)); }
      50%      { filter: drop-shadow(0 0 18px rgba(255,209,0,0.85)); }
    }
    /* Fallback emoji when SVG fails to load */
    .badge-icon-fallback {
      font-size: 36px;
      filter: drop-shadow(0 0 8px var(--tier-gold-glow));
    }
    .badge-icon-wrap.pending .badge-icon-fallback {
      /* Same as earned per spec */
      filter: drop-shadow(0 0 8px var(--tier-gold-glow));
    }

    .badge-text { flex: 1; min-width: 0; }
    .badge-name {
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      margin-bottom: var(--spacing-1);
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
      flex-wrap: wrap;
    }
    .badge-name .tap-hint {
      font-size: 11px;
      font-weight: var(--font-weight-regular);
      color: var(--color-on-primary-3);
      opacity: 0.7;
    }
    .badge-not-yet-tag {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 1px 8px;
      border-radius: var(--radius-full);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: var(--color-on-primary-3);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.04em;
    }
    .badge-card .tap-arrow {
      flex-shrink: 0;
      color: var(--color-on-primary-3);
      font-size: 18px;
      opacity: 0.5;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .badge-card:hover .tap-arrow {
      transform: translateX(3px);
      opacity: 0.9;
    }
    .badge-status-earned {
      font-size: var(--font-body-small);
      color: var(--color-preset-green);
      font-weight: var(--font-weight-semibold);
    }
    .badge-status-pending {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
    }
    .badge-progress-section {
      padding: 0 var(--spacing-6) var(--spacing-5);
    }
    .badge-progress-nums {
      display: flex;
      justify-content: space-between;
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
      margin-bottom: var(--spacing-2);
    }
    .badge-progress-nums span:first-child { color: var(--color-on-primary-2); }

    /* ═══════════════════════════════════════════════════
       Settled Records
    ═══════════════════════════════════════════════════ */
    .records-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-3);
    }
    .total-rebate-chip {
      background: rgba(0,210,190,0.10);
      border: 1px solid rgba(0,210,190,0.25);
      border-radius: var(--radius-full);
      padding: var(--spacing-1) var(--spacing-3);
      font-size: var(--font-body-small);
      color: var(--color-primary);
    }
    .record-card {
      background: var(--color-surface-container);
      border-radius: var(--radius-m);
      border: 1px solid var(--color-outline-variant);
      margin-bottom: var(--spacing-3);
      overflow: hidden;
      animation: fade-up 0.35s ease both;
    }
    .record-card:last-child { margin-bottom: 0; }
    .record-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-3) var(--spacing-4);
      border-bottom: 1px solid var(--color-outline-variant);
    }
    .record-date {
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
    }
    .record-tier-chip {
      display: flex;
      align-items: center;
      gap: var(--spacing-1);
      padding: var(--spacing-1) var(--spacing-2);
      border-radius: var(--radius-full);
      font-size: var(--font-body-small);
      font-weight: var(--font-weight-semibold);
    }
    .record-tier-chip.bronze { color: var(--tier-bronze-color); background: rgba(255,114,0,0.10); }
    .record-tier-chip.silver { color: var(--tier-silver-color); background: rgba(200,200,200,0.08); }
    .record-tier-chip.gold   { color: var(--tier-gold-color);   background: rgba(255,209,0,0.10); }
    .record-tier-chip.diamond{ color: var(--tier-diamond-color);background: rgba(0,210,190,0.10); }
    .record-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      padding: var(--spacing-3) var(--spacing-2);
    }
    .record-stat { padding: var(--spacing-2) var(--spacing-2); text-align: center; }
    .record-stat-label {
      font-size: 11px;
      color: var(--color-on-primary-3);
      margin-bottom: var(--spacing-1);
      line-height: 1;
    }
    .record-stat-value {
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
    }
    .record-stat-value.teal { color: var(--color-primary); }
    .record-bonus-tag {
      display: flex;
      align-items: center;
      gap: var(--spacing-1);
      padding: var(--spacing-2) var(--spacing-4);
      background: rgba(21,234,72,0.06);
      border-top: 1px solid rgba(21,234,72,0.12);
      font-size: var(--font-body-small);
      color: var(--color-preset-green);
    }

    /* ═══════════════════════════════════════════════════
       Rules Section
    ═══════════════════════════════════════════════════ */
    .rules-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-4) var(--spacing-5);
      background: var(--color-surface-container);
      border: 1px solid var(--color-outline-variant);
      border-radius: var(--radius-m);
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .rules-toggle:hover { background: var(--color-surface-variant); }
    .rules-toggle-label { font-size: var(--font-body-medium); color: var(--color-on-primary-2); }
    .rules-arrow {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
      transition: transform 0.25s;
    }
    .rules-arrow.open { transform: rotate(180deg); }
    .rules-body {
      background: var(--color-surface-container);
      border: 1px solid var(--color-outline-variant);
      border-top: none;
      border-radius: 0 0 var(--radius-m) var(--radius-m);
      padding: 0 var(--spacing-5) var(--spacing-5);
      display: none;
    }
    .rules-body.open { display: block; }
    .rules-sub-title {
      font-size: var(--font-body-small);
      font-weight: var(--font-weight-semibold);
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-top: var(--spacing-4);
      padding-bottom: var(--spacing-3);
    }
    .tier-table { width: 100%; border-collapse: collapse; }
    .tier-table th {
      font-size: 11px;
      color: var(--color-on-primary-3);
      text-align: left;
      padding: var(--spacing-2) var(--spacing-2);
      border-bottom: 1px solid var(--color-outline-variant);
      font-weight: var(--font-weight-regular);
    }
    .tier-table td {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-2);
      padding: var(--spacing-3) var(--spacing-2);
      border-bottom: 1px solid var(--color-outline-variant);
      vertical-align: middle;
    }
    .tier-table tr:last-child td { border-bottom: none; }
    .tier-table .tier-cell {
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
      font-weight: var(--font-weight-semibold);
    }
    .rules-note {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
      line-height: 1.6;
      padding: var(--spacing-2) 0;
    }
    .rules-note + .rules-note { border-top: 1px solid var(--color-outline-variant); }
    .rules-highlight { color: var(--color-on-primary-2); }

    /* ═══════════════════════════════════════════════════
       Notice Section (collapsible, same skeleton as rules)
    ═══════════════════════════════════════════════════ */
    .notice-toggle {
      margin-top: var(--spacing-3);
    }
    .notice-toggle .notice-icon {
      margin-right: var(--spacing-2);
      font-size: var(--font-body-medium);
    }
    .notice-toggle .rules-toggle-label {
      display: inline-flex;
      align-items: center;
    }
    .notice-body {
      /* same .rules-body, but list-friendly padding */
      padding: 0 var(--spacing-5) var(--spacing-4);
    }
    .notice-list {
      margin: 0;
      padding: var(--spacing-3) 0 0 0;
      list-style: none;
      counter-reset: notice-counter;
    }
    .notice-list li {
      counter-increment: notice-counter;
      position: relative;
      padding: var(--spacing-3) 0 var(--spacing-3) var(--spacing-7);
      font-size: var(--font-body-small);
      color: var(--color-on-primary-2);
      line-height: 1.7;
      letter-spacing: 0.01em;
    }
    .notice-list li + li {
      border-top: 1px solid var(--color-outline-variant);
    }
    .notice-list li::before {
      content: counter(notice-counter);
      position: absolute;
      left: 0;
      top: calc(var(--spacing-3) + 2px);
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(0,210,190,0.10);
      border: 1px solid rgba(0,210,190,0.3);
      color: var(--color-primary);
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════════════════
       Countdown (Header)
    ═══════════════════════════════════════════════════ */
    .countdown {
      position: relative;
      margin: var(--spacing-3) auto var(--spacing-5);
      z-index: 1;
    }
    .countdown-label {
      font-size: 11px;
      color: var(--color-on-primary-2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: var(--spacing-2);
      opacity: 0.75;
    }
    .countdown-grid {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-1);
    }
    .countdown-cell {
      background: linear-gradient(180deg, rgba(0,210,190,0.18), rgba(0,210,190,0.06));
      border: 1px solid rgba(0,210,190,0.35);
      border-radius: var(--radius-s);
      padding: var(--spacing-2) var(--spacing-3);
      min-width: 48px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,210,190,0.10);
    }
    .countdown-num {
      font-size: var(--font-title-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }
    .countdown-unit {
      font-size: 10px;
      color: var(--color-on-primary-3);
      margin-top: 2px;
      letter-spacing: 0.05em;
    }
    .countdown-sep {
      font-size: var(--font-title-medium);
      color: rgba(0,210,190,0.5);
      font-weight: var(--font-weight-semibold);
      padding: 0 1px;
      animation: blink-sep 1s ease-in-out infinite;
    }
    @keyframes blink-sep {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }
    .countdown-message {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-2);
      padding: var(--spacing-2) var(--spacing-4);
      background: rgba(0,0,0,0.30);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: var(--radius-full);
      display: inline-block;
    }

    /* ═══════════════════════════════════════════════════
       Today Card · Updated-at chip
    ═══════════════════════════════════════════════════ */
    .updated-chip {
      position: absolute;
      top: var(--spacing-3);
      right: var(--spacing-4);
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-1);
      font-size: 10px;
      color: var(--color-on-primary-3);
      letter-spacing: 0.02em;
      z-index: 2;
    }
    .updated-chip .chip-sep {
      color: var(--color-on-primary-3);
      opacity: 0.5;
      margin: 0 2px;
    }
    .updated-chip .refresh-btn {
      background: none;
      border: none;
      color: var(--color-on-primary-3);
      cursor: pointer;
      padding: 2px;
      margin-left: var(--spacing-1);
      font-size: 12px;
      transition: transform 0.5s ease, color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .updated-chip .refresh-btn:hover { color: var(--color-primary); }
    .updated-chip .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    /* Rules CTA button (next to updated-chip) */
    .updated-chip .rules-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(130,56,186,0.18);
      border: 1px solid rgba(130,56,186,0.4);
      border-radius: var(--radius-full);
      color: var(--color-on-primary-1);
      cursor: pointer;
      padding: 2px 8px;
      font-size: 10px;
      font-family: var(--font-family);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .updated-chip .rules-cta-btn:hover {
      background: rgba(130,56,186,0.32);
      border-color: rgba(130,56,186,0.7);
      transform: translateY(-1px);
    }
    .updated-chip .rules-cta-btn:active {
      transform: translateY(0);
    }
    .updated-chip .rules-cta-btn > span:first-child {
      font-size: 11px;
    }
    .today-card { position: relative; }  /* enable absolute positioning for chip */

    /* ═══════════════════════════════════════════════════
       Tier banner · Old-badge guarantee chip
    ═══════════════════════════════════════════════════ */
    .tier-old-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 1px 6px;
      margin-left: var(--spacing-2);
      border-radius: var(--radius-xs);
      background: rgba(255,209,0,0.15);
      border: 1px solid rgba(255,209,0,0.40);
      color: var(--tier-gold-color);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      vertical-align: middle;
    }

    /* ═══════════════════════════════════════════════════
       Next-tier estimate hint (under progress bar)
    ═══════════════════════════════════════════════════ */
    .next-tier-hint {
      margin-top: var(--spacing-3);
      padding: var(--spacing-3) var(--spacing-4);
      background: rgba(0,210,190,0.06);
      border: 1px dashed rgba(0,210,190,0.30);
      border-radius: var(--radius-s);
      font-size: var(--font-body-small);
      color: var(--color-on-primary-2);
      line-height: 1.5;
    }
    .next-tier-hint .arrow {
      color: var(--color-primary);
      margin: 0 4px;
    }
    .next-tier-hint .tier-name-inline {
      font-weight: var(--font-weight-semibold);
    }
    .next-tier-hint .max-rebate {
      color: var(--tier-gold-color);
      font-weight: var(--font-weight-semibold);
    }
    .next-tier-hint.at-max {
      background: rgba(0,210,190,0.10);
      border-color: rgba(0,210,190,0.5);
      border-style: solid;
      color: var(--color-primary);
    }

    /* ═══════════════════════════════════════════════════
       Bonus row · Active banner + Pending progress
    ═══════════════════════════════════════════════════ */
    .bonus-row.active {
      background: linear-gradient(90deg, rgba(21,234,72,0.12), rgba(21,234,72,0.04));
      border-top: 1px solid rgba(21,234,72,0.35);
    }
    .bonus-row.active .bonus-text {
      color: var(--color-preset-green);
      font-weight: var(--font-weight-semibold);
    }
    .bonus-pending {
      padding: var(--spacing-3) var(--spacing-5);
      background: rgba(71,71,71,0.20);
      border-top: 1px solid var(--color-outline-variant);
    }
    .bonus-pending-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: var(--font-body-small);
      color: var(--color-on-primary-2);
      margin-bottom: var(--spacing-1);
    }
    .bonus-pending-head .label { display: inline-flex; align-items: center; gap: var(--spacing-2); }
    .bonus-pending-head .count { color: var(--color-primary); font-weight: var(--font-weight-semibold); font-variant-numeric: tabular-nums; }
    .bonus-pending-hint {
      font-size: 10px;
      color: var(--color-on-primary-3);
      margin-top: 4px;
    }

    /* ═══════════════════════════════════════════════════
       Summary Card (Cumulative Overview)
    ═══════════════════════════════════════════════════ */
    .summary-card {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background:
        radial-gradient(ellipse 70% 80% at 50% 0%, rgba(0,210,190,0.08) 0%, transparent 70%),
        var(--color-surface-container);
      border: 1px solid var(--color-outline);
      border-radius: var(--radius-l);
      overflow: hidden;
      animation: fade-up 0.4s 0.05s ease both;
      box-shadow:
        0 0 0 1px rgba(0,210,190,0.05),
        0 8px 24px -8px rgba(25,25,25,0.4);
    }
    .summary-cell {
      padding: var(--spacing-4) var(--spacing-3);
      text-align: center;
      border-right: 1px solid var(--color-outline-variant);
    }
    .summary-cell:last-child { border-right: none; }
    .summary-cell-label {
      font-size: 11px;
      color: var(--color-on-primary-3);
      letter-spacing: 0.03em;
      margin-bottom: var(--spacing-2);
      line-height: 1.2;
    }
    .summary-cell-value {
      font-size: var(--font-title-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      line-height: 1.1;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }
    .summary-cell-value.teal { color: var(--color-primary); }
    .summary-cell-value .unit-small {
      font-size: 10px;
      color: var(--color-on-primary-3);
      font-weight: var(--font-weight-regular);
      margin-left: 2px;
    }

    /* ═══════════════════════════════════════════════════
       Record card · Old-badge guarantee tag
    ═══════════════════════════════════════════════════ */
    .record-old-badge-tag {
      display: flex;
      align-items: center;
      gap: var(--spacing-1);
      padding: var(--spacing-2) var(--spacing-4);
      background: rgba(255,209,0,0.08);
      border-top: 1px solid rgba(255,209,0,0.18);
      font-size: 11px;
      color: var(--tier-gold-color);
    }

    /* ═══════════════════════════════════════════════════
       Badge Modal (Anime-style: glow, sparkles, pink/yellow/purple)
    ═══════════════════════════════════════════════════ */
    .badge-modal-scrim {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(60,30,90,0.85) 0%, rgba(15,5,30,0.95) 70%);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .badge-modal-scrim.open {
      opacity: 1;
      pointer-events: auto;
    }

    .badge-modal {
      position: relative;
      width: 100%;
      max-width: 360px;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(246,65,141,0.25) 0%, transparent 65%),
        radial-gradient(ellipse 100% 80% at 50% 50%, rgba(130,56,186,0.20) 0%, transparent 70%),
        linear-gradient(180deg, #2a1855 0%, #1a0e3d 100%);
      border-radius: var(--radius-xl);
      padding: var(--spacing-7) var(--spacing-6) var(--spacing-6);
      text-align: center;
      overflow: hidden;
      transform: scale(0.85) translateY(20px);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      border: 1px solid rgba(255,209,0,0.25);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 24px 60px -12px rgba(0,0,0,0.7),
        0 0 60px rgba(246,65,141,0.20);
    }
    .badge-modal-scrim.open .badge-modal {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* Anime sparkles overlay */
    .badge-modal::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 18% 22%, #fff7c2 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 32% 38%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(2px 2px at 78% 18%, #ffcce6 0%, transparent 100%),
        radial-gradient(1px 1px at 86% 35%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 15% 70%, #cba8ff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 88% 78%, #fff7c2 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 92%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 25% 88%, rgba(246,65,141,0.7) 0%, transparent 100%);
      animation: sparkle-twinkle 2.8s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes sparkle-twinkle {
      0%, 100% { opacity: 0.9; }
      50%      { opacity: 0.4; }
    }

    .badge-modal-close {
      position: absolute;
      top: var(--spacing-3);
      right: var(--spacing-3);
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      color: var(--color-on-primary-1);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: background 0.2s, transform 0.2s;
    }
    .badge-modal-close:hover {
      background: rgba(255,255,255,0.20);
      transform: rotate(90deg);
    }

    .badge-modal-hero {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto var(--spacing-5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Outer rotating halo */
    .badge-modal-hero::before {
      content: '';
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(255,209,0,0.0) 0deg,
        rgba(255,209,0,0.7) 60deg,
        rgba(246,65,141,0.7) 120deg,
        rgba(130,56,186,0.7) 180deg,
        rgba(255,209,0,0.7) 240deg,
        rgba(246,65,141,0.7) 300deg,
        rgba(255,209,0,0.0) 360deg
      );
      filter: blur(18px);
      animation: rotate-halo 6s linear infinite;
      pointer-events: none;
    }
    /* Inner glow ring */
    .badge-modal-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,209,0,0.35) 0%, transparent 70%);
      animation: pulse-glow 2.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes rotate-halo {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.7; transform: scale(0.95); }
      50%      { opacity: 1;   transform: scale(1.08); }
    }
    .badge-modal-hero img {
      position: relative;
      width: 120px;
      height: 120px;
      object-fit: contain;
      z-index: 1;
      filter: drop-shadow(0 0 20px rgba(255,209,0,0.6));
      animation: badge-float 3s ease-in-out infinite;
    }
    .badge-modal-hero.locked img {
      filter: grayscale(1) brightness(0.55) opacity(0.55);
      animation: none;
    }
    .badge-modal-hero.locked::before,
    .badge-modal-hero.locked::after {
      opacity: 0.35;
    }
    @keyframes badge-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .badge-modal-fallback {
      font-size: 96px;
      filter: drop-shadow(0 0 20px rgba(255,209,0,0.6));
    }

    .badge-modal-title {
      position: relative;
      font-size: var(--font-headline-small);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      margin-bottom: var(--spacing-3);
      letter-spacing: 0.04em;
      text-shadow: 0 0 16px rgba(255,209,0,0.4);
      z-index: 1;
    }

    .badge-modal-status {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-2);
      padding: var(--spacing-1) var(--spacing-4);
      border-radius: var(--radius-full);
      font-size: var(--font-body-small);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--spacing-5);
      z-index: 1;
    }
    .badge-modal-status.earned {
      background: rgba(21,234,72,0.15);
      color: var(--color-preset-green);
      border: 1px solid rgba(21,234,72,0.4);
    }
    .badge-modal-status.locked {
      background: rgba(255,255,255,0.08);
      color: var(--color-on-primary-2);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .badge-modal-status.owned {
      background: linear-gradient(180deg, rgba(255,209,0,0.30), rgba(255,165,0,0.15));
      color: var(--tier-gold-color);
      border: 1px solid rgba(255,209,0,0.65);
      box-shadow: 0 0 14px rgba(255,209,0,0.30);
    }

    .badge-modal-section {
      position: relative;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: var(--radius-m);
      padding: var(--spacing-4) var(--spacing-5);
      margin-bottom: var(--spacing-3);
      text-align: left;
      z-index: 1;
    }
    .badge-modal-section-label {
      font-size: 11px;
      color: var(--color-on-primary-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: var(--spacing-2);
    }
    .badge-modal-section-body {
      font-size: var(--font-body-medium);
      color: var(--color-on-primary-1);
      line-height: 1.4;
    }

    .badge-modal-progress {
      position: relative;
      z-index: 1;
    }
    .badge-modal-progress-nums {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: var(--spacing-2);
    }
    .badge-modal-progress-nums .current {
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--tier-gold-color);
    }
    .badge-modal-progress-nums .threshold {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
    }
    .badge-modal-progress .progress-track {
      height: 8px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge-modal-progress .progress-fill {
      background: linear-gradient(90deg, var(--tier-gold-color) 0%, var(--color-preset-pink) 100%);
      box-shadow: 0 0 8px rgba(255,209,0,0.5);
    }

    /* ═══════════════════════════════════════════════════
       Rules Modal (shares badge-modal styles + rules-specific)
    ═══════════════════════════════════════════════════ */
    .rules-modal {
      max-width: 400px;
      padding-top: var(--spacing-6);
    }
    .rules-modal-icon {
      font-size: 32px;
      text-align: center;
      margin: 0 auto var(--spacing-3);
      filter: drop-shadow(0 0 12px rgba(255,209,0,0.55));
      animation: badge-breath 3s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }
    .rules-modal-title {
      font-size: var(--font-title-large);
      margin-bottom: var(--spacing-5);
    }
    .rules-modal-section {
      position: relative;
      z-index: 1;
      background: rgba(0,0,0,0.30);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: var(--radius-m);
      padding: var(--spacing-4) var(--spacing-4);
      margin-bottom: var(--spacing-3);
      text-align: left;
    }
    .rules-modal-section-head {
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      margin-bottom: var(--spacing-3);
    }
    .rules-modal-section-icon {
      font-size: 16px;
    }

    /* Rules tier table inside modal */
    .rules-modal-tier-table {
      width: 100%;
      border-collapse: collapse;
    }
    .rules-modal-tier-table th {
      font-size: 10px;
      color: var(--color-on-primary-3);
      text-align: left;
      padding: var(--spacing-1) var(--spacing-2);
      border-bottom: 1px solid rgba(255,255,255,0.15);
      font-weight: var(--font-weight-regular);
      letter-spacing: 0.04em;
    }
    .rules-modal-tier-table td {
      font-size: 12px;
      color: var(--color-on-primary-2);
      padding: var(--spacing-3) var(--spacing-2);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: middle;
    }
    .rules-modal-tier-table tr:last-child td { border-bottom: none; }
    .rules-modal-tier-table .tier-cell {
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
      font-weight: var(--font-weight-semibold);
    }
    /* Highlight current tier row */
    .rules-modal-tier-table tr.current-tier td {
      background: linear-gradient(90deg, rgba(255,209,0,0.10), rgba(255,209,0,0.04));
      border-top: 1px solid rgba(255,209,0,0.40);
      border-bottom: 1px solid rgba(255,209,0,0.40);
    }
    .rules-modal-tier-table tr.current-tier td:first-child {
      border-left: 3px solid var(--tier-gold-color);
      padding-left: calc(var(--spacing-2) - 3px);
    }
    .current-tier-chip {
      display: inline-block;
      margin-left: var(--spacing-1);
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: rgba(255,209,0,0.20);
      border: 1px solid rgba(255,209,0,0.6);
      color: var(--tier-gold-color);
      font-size: 9px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.03em;
      vertical-align: middle;
    }

    /* Bullet list inside section */
    .rules-note-list .rules-note {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-2);
      line-height: 1.65;
      padding: var(--spacing-2) 0;
    }
    .rules-note-list .rules-note + .rules-note {
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .rules-note-list .rules-highlight {
      color: var(--tier-gold-color);
      font-weight: var(--font-weight-semibold);
    }

    /* ═══════════════════════════════════════════════════
       Slim Countdown Pill (replaces big 4-cell grid)
    ═══════════════════════════════════════════════════ */
    .countdown-pill {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-2);
      padding: var(--spacing-2) var(--spacing-4);
      background: rgba(0,0,0,0.30);
      border: 1px solid rgba(0,210,190,0.35);
      border-radius: var(--radius-full);
      margin-bottom: var(--spacing-4);
      font-size: var(--font-body-small);
      color: var(--color-on-primary-1);
      backdrop-filter: blur(4px);
      box-shadow: 0 0 14px rgba(0,210,190,0.15);
      position: relative;
      z-index: 1;
    }
    .countdown-pill.ended {
      border-color: rgba(255,255,255,0.20);
      box-shadow: none;
    }
    .countdown-pill-icon {
      font-size: 13px;
    }
    .countdown-pill-time {
      font-variant-numeric: tabular-nums;
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.04em;
    }

    /* ═══════════════════════════════════════════════════
       ⭐ HERO Rebate Card (Main conversion focal point)
    ═══════════════════════════════════════════════════ */
    .hero-card {
      position: relative;
      background:
        radial-gradient(ellipse 100% 70% at 50% 0%, rgba(255,209,0,0.12) 0%, transparent 65%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(130,56,186,0.18) 0%, transparent 60%),
        linear-gradient(180deg, #2a1855 0%, #1c0d3e 100%);
      border: 1px solid rgba(255,209,0,0.35);
      border-radius: var(--radius-l);
      padding: var(--spacing-5) var(--spacing-5) var(--spacing-5);
      overflow: hidden;
      animation: fade-up 0.4s ease both;
      box-shadow:
        0 0 0 1px rgba(255,209,0,0.05),
        0 12px 32px -8px rgba(25,25,25,0.55),
        0 0 40px rgba(255,209,0,0.10);
    }
    /* Sparkles behind Hero */
    .hero-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,209,0,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 28% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 78% 28%, rgba(255,209,0,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 90%, rgba(255,209,0,0.6) 0%, transparent 100%);
      animation: twinkle 3s ease-in-out infinite;
      pointer-events: none;
    }
    .hero-top-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-3);
    }
    .hero-eyebrow {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-2);
      letter-spacing: 0.04em;
    }
    .hero-action-row {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-2);
      font-size: 10px;
      color: var(--color-on-primary-3);
    }
    .hero-action-row .updated-text { letter-spacing: 0.02em; }
    .hero-action-row .refresh-btn,
    .hero-action-row .rules-cta-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: var(--font-family);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hero-action-row .refresh-btn {
      color: var(--color-on-primary-3);
      font-size: 12px;
      transition: transform 0.5s ease, color 0.2s;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .hero-action-row .refresh-btn:hover { color: var(--color-primary); }
    .hero-action-row .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
    .hero-action-row .rules-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(130,56,186,0.18);
      border: 1px solid rgba(130,56,186,0.4);
      border-radius: var(--radius-full);
      color: var(--color-on-primary-1);
      padding: 2px 8px;
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .hero-action-row .rules-cta-btn:hover {
      background: rgba(130,56,186,0.32);
      border-color: rgba(130,56,186,0.7);
      transform: translateY(-1px);
    }
    .hero-action-row .chip-sep { color: rgba(255,255,255,0.25); }

    .hero-amount-wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: var(--spacing-3) 0 var(--spacing-4);
    }
    .hero-amount {
      font-size: 64px;
      font-weight: var(--font-weight-semibold);
      line-height: 1.0;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #fff4a0 0%, #ffd100 45%, #ff9d00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 16px rgba(255,209,0,0.45));
      display: inline-flex;
      align-items: baseline;
      gap: var(--spacing-2);
    }
    .hero-amount .diamond-icon {
      font-size: 28px;
      -webkit-text-fill-color: initial;
      background: none;
      filter: drop-shadow(0 0 8px rgba(0,210,190,0.7));
    }
    .hero-amount.capped::after {
      content: ' ▲';
      font-size: 16px;
      color: var(--tier-gold-color);
      -webkit-text-fill-color: initial;
      background: none;
    }
    .hero-cap-note {
      display: inline-block;
      margin-top: var(--spacing-2);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: rgba(255,209,0,0.15);
      border: 1px solid rgba(255,209,0,0.4);
      color: var(--tier-gold-color);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.04em;
    }

    /* Tier strip inside Hero */
    .hero-tier-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: var(--spacing-3);
      padding: var(--spacing-3) var(--spacing-4);
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: var(--radius-m);
      margin-bottom: var(--spacing-3);
    }
    .hero-tier-icon-wrap {
      width: 36px; height: 36px;
      border-radius: var(--radius-s);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      position: relative;
    }
    .hero-tier-icon-wrap.bronze  { background: rgba(255,114,0,0.18); color: var(--tier-bronze-color); box-shadow: 0 0 14px var(--tier-bronze-glow); }
    .hero-tier-icon-wrap.silver  { background: rgba(200,200,200,0.10); color: var(--tier-silver-color); box-shadow: 0 0 14px var(--tier-silver-glow); }
    .hero-tier-icon-wrap.gold    { background: rgba(255,209,0,0.15); color: var(--tier-gold-color); box-shadow: 0 0 14px var(--tier-gold-glow); }
    .hero-tier-icon-wrap.diamond { background: rgba(0,210,190,0.15); color: var(--tier-diamond-color); box-shadow: 0 0 14px var(--tier-diamond-glow); }
    .hero-tier-icon-wrap.none    { background: rgba(255,255,255,0.05); color: var(--color-on-primary-3); }

    .hero-tier-info {
      flex: 1;
      min-width: 0;
    }
    .hero-tier-info .name-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      margin-bottom: 2px;
    }
    .hero-tier-info .rate-pill {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: var(--radius-xs);
      background: rgba(0,210,190,0.15);
      border: 1px solid rgba(0,210,190,0.4);
      color: var(--color-primary);
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }
    .hero-tier-info .bonus-tag {
      display: inline-flex;
      padding: 1px 6px;
      border-radius: var(--radius-xs);
      background: rgba(21,234,72,0.15);
      border: 1px solid rgba(21,234,72,0.4);
      color: var(--color-preset-green);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
    }
    .hero-tier-info .gap-line {
      font-size: 11px;
      color: var(--color-on-primary-2);
      line-height: 1.4;
    }
    .hero-tier-info .gap-amount {
      color: var(--tier-gold-color);
      font-weight: var(--font-weight-semibold);
    }
    .hero-tier-info .gap-line .max-rebate {
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
    }
    .hero-tier-old-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 1px 6px;
      border-radius: var(--radius-xs);
      background: rgba(255,209,0,0.15);
      border: 1px solid rgba(255,209,0,0.40);
      color: var(--tier-gold-color);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
    }

    /* Progress bar in Hero */
    .hero-progress {
      position: relative;
      z-index: 1;
      margin-bottom: var(--spacing-4);
    }
    .hero-progress .progress-track {
      height: 8px;
      background: rgba(0,0,0,0.4);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .hero-progress .progress-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .hero-progress .progress-fill.bronze  { background: linear-gradient(90deg, var(--tier-bronze-color), #ffa86a); }
    .hero-progress .progress-fill.silver  { background: linear-gradient(90deg, var(--tier-silver-color), #ffffff); }
    .hero-progress .progress-fill.gold    { background: linear-gradient(90deg, var(--tier-gold-color), #fff4a0); }
    .hero-progress .progress-fill.diamond { background: linear-gradient(90deg, var(--tier-diamond-color), #6fffd5); }
    .hero-progress .progress-fill.maxed   { background: linear-gradient(90deg, var(--tier-diamond-color), var(--tier-gold-color)); }
    .hero-progress .progress-nums {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--color-on-primary-3);
      margin-top: var(--spacing-1);
      font-variant-numeric: tabular-nums;
    }

    /* Bonus banner inside Hero */
    .hero-bonus-banner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
      padding: var(--spacing-2) var(--spacing-3);
      background: linear-gradient(90deg, rgba(21,234,72,0.18), rgba(21,234,72,0.06));
      border: 1px solid rgba(21,234,72,0.35);
      border-radius: var(--radius-s);
      margin-bottom: var(--spacing-3);
      font-size: 12px;
      color: var(--color-preset-green);
      font-weight: var(--font-weight-semibold);
    }
    .hero-bonus-pending {
      position: relative;
      z-index: 1;
      padding: var(--spacing-2) var(--spacing-3);
      background: rgba(71,71,71,0.18);
      border: 1px dashed rgba(255,255,255,0.12);
      border-radius: var(--radius-s);
      margin-bottom: var(--spacing-3);
      font-size: 11px;
      color: var(--color-on-primary-3);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .hero-bonus-pending .count { color: var(--color-primary); font-weight: var(--font-weight-semibold); font-variant-numeric: tabular-nums; }

    /* Hero CTA button (inline, primary) */
    .hero-cta-btn {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: var(--spacing-3) var(--spacing-5);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0) 50%),
        linear-gradient(135deg, #ffa500 0%, #ffd100 50%, #ffa500 100%);
      border: 1.5px solid rgba(255,255,255,0.45);
      border-radius: var(--radius-full);
      color: #4a2a00;
      font-size: var(--font-body-large);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.06em;
      text-decoration: none;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.10),
        0 8px 22px rgba(255,165,0,0.50),
        0 0 28px rgba(255,209,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.50);
      transition: transform 0.18s ease, box-shadow 0.2s ease;
      animation: hero-cta-pulse 2.2s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
    }
    .hero-cta-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.10),
        0 12px 28px rgba(255,165,0,0.65),
        0 0 40px rgba(255,209,0,0.65),
        inset 0 1px 0 rgba(255,255,255,0.55);
    }
    .hero-cta-btn:active { transform: translateY(0); transition-duration: 0.08s; }
    @keyframes hero-cta-pulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(0,0,0,0.10), 0 8px 22px rgba(255,165,0,0.50), 0 0 28px rgba(255,209,0,0.45), inset 0 1px 0 rgba(255,255,255,0.50); }
      50%      { box-shadow: 0 0 0 1px rgba(0,0,0,0.10), 0 10px 26px rgba(255,165,0,0.65), 0 0 44px rgba(255,209,0,0.65), inset 0 1px 0 rgba(255,255,255,0.55); }
    }

    /* ═══════════════════════════════════════════════════
       No-bet state — empty card for users without any bet today
    ═══════════════════════════════════════════════════ */
    .hero-card.no-bet {
      text-align: center;
      padding: var(--spacing-7) var(--spacing-5);
      border-style: dashed;
    }
    .hero-no-bet-icon {
      font-size: 56px;
      margin-bottom: var(--spacing-3);
      filter: drop-shadow(0 0 14px rgba(255,209,0,0.45));
      animation: gamepad-bob 2.6s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes gamepad-bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .hero-no-bet-title {
      font-size: var(--font-title-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      margin-bottom: var(--spacing-2);
      letter-spacing: 0.02em;
    }
    .hero-no-bet-sub {
      font-size: var(--font-body-small);
      color: var(--color-on-primary-3);
      margin-bottom: var(--spacing-4);
      line-height: 1.5;
    }

    /* Rules link above CTA (subtle text-button style) */
    .hero-no-bet-rules-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      padding: var(--spacing-2) var(--spacing-3);
      margin-bottom: var(--spacing-4);
      color: var(--color-on-primary-2);
      font-size: var(--font-body-small);
      font-family: var(--font-family);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      letter-spacing: 0.02em;
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,0.25);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: color 0.2s, text-decoration-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .hero-no-bet-rules-link:hover {
      color: var(--color-primary);
      text-decoration-color: rgba(0,210,190,0.6);
    }
    .hero-no-bet-rules-link:active { opacity: 0.7; }

    /* Big CTA — 100% width, larger padding, strong breathing + shimmer sweep */
    .hero-cta-btn.no-bet-cta-big {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 100%;
      padding: var(--spacing-4) var(--spacing-5);
      font-size: var(--font-title-small);
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-2);
      letter-spacing: 0.08em;
      animation: hero-cta-pulse-strong 1.8s ease-in-out infinite;
    }
    /* Shimmer sweep — diagonal white gleam moving across button */
    .hero-cta-btn.no-bet-cta-big .hero-cta-shimmer {
      position: absolute;
      top: 0;
      left: -60%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        100deg,
        transparent 0%,
        rgba(255,255,255,0.0) 30%,
        rgba(255,255,255,0.45) 50%,
        rgba(255,255,255,0.0) 70%,
        transparent 100%
      );
      transform: skewX(-22deg);
      animation: cta-shimmer-sweep 2.6s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .hero-cta-btn.no-bet-cta-big .cta-main-text {
      position: relative;
      z-index: 1;  /* keep text above shimmer */
    }
    @keyframes cta-shimmer-sweep {
      0%   { left: -60%; }
      60%  { left: 120%; }
      100% { left: 120%; }
    }
    /* Stronger breathing for "go play" CTA */
    @keyframes hero-cta-pulse-strong {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(0,0,0,0.10),
          0 8px 22px rgba(255,165,0,0.55),
          0 0 32px rgba(255,209,0,0.50),
          inset 0 1px 0 rgba(255,255,255,0.55);
        transform: scale(1);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(0,0,0,0.10),
          0 12px 30px rgba(255,165,0,0.75),
          0 0 52px rgba(255,209,0,0.75),
          inset 0 1px 0 rgba(255,255,255,0.60);
        transform: scale(1.015);
      }
    }
    /* When user hovers, freeze the breathing on the bigger state */
    .hero-cta-btn.no-bet-cta-big:hover {
      animation-play-state: paused;
    }

    /* ═══════════════════════════════════════════════════
       📊 Status Card (secondary three-cell)
    ═══════════════════════════════════════════════════ */
    .status-card {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: var(--color-surface-container);
      border: 1px solid var(--color-outline);
      border-radius: var(--radius-l);
      overflow: hidden;
      animation: fade-up 0.4s 0.05s ease both;
    }
    .status-cell {
      padding: var(--spacing-4) var(--spacing-2);
      text-align: center;
      border-right: 1px solid var(--color-outline-variant);
    }
    .status-cell:last-child { border-right: none; }
    .status-cell-label {
      font-size: 11px;
      color: var(--color-on-primary-3);
      margin-bottom: var(--spacing-2);
      line-height: 1.2;
      letter-spacing: 0.03em;
    }
    .status-cell-value {
      font-size: var(--font-title-small);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .status-cell-value .unit-small {
      font-size: 10px;
      color: var(--color-on-primary-3);
      font-weight: var(--font-weight-regular);
      margin-left: 2px;
    }

    /* ═══════════════════════════════════════════════════
       🏆 Achievement Card (Badge + Cumulative merged)
    ═══════════════════════════════════════════════════ */
    .achievement-card {
      background:
        radial-gradient(ellipse 60% 60% at 0% 0%, rgba(255,209,0,0.10) 0%, transparent 60%),
        var(--color-surface-container);
      border: 1px solid var(--color-outline);
      border-radius: var(--radius-l);
      overflow: hidden;
      animation: fade-up 0.4s 0.1s ease both;
      box-shadow:
        0 0 0 1px rgba(255,209,0,0.05),
        0 8px 24px -8px rgba(25,25,25,0.4);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .achievement-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,209,0,0.4);
      box-shadow:
        0 0 0 1px rgba(255,209,0,0.15),
        0 12px 28px -8px rgba(25,25,25,0.55);
    }
    .achievement-card:active { transform: translateY(0); transition-duration: 0.1s; }
    .achievement-head {
      padding: var(--spacing-5) var(--spacing-5) var(--spacing-3);
      display: flex;
      align-items: center;
      gap: var(--spacing-4);
    }
    .achievement-badge-wrap {
      width: 56px; height: 56px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .achievement-badge-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(255,209,0,0.55));
      animation: badge-breath 3s ease-in-out infinite;
      transition: transform 0.35s ease;
    }
    .achievement-card:hover .achievement-badge-wrap img { transform: scale(1.06); }
    .achievement-badge-fallback {
      font-size: 36px;
      filter: drop-shadow(0 0 8px var(--tier-gold-glow));
    }
    .achievement-text {
      flex: 1;
      min-width: 0;
    }
    .achievement-name {
      display: flex;
      align-items: center;
      gap: var(--spacing-2);
      font-size: var(--font-body-medium);
      font-weight: var(--font-weight-semibold);
      color: var(--color-on-primary-1);
      margin-bottom: 2px;
      flex-wrap: wrap;
    }
    .achievement-status-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 1px 8px;
      border-radius: var(--radius-full);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.03em;
    }
    .achievement-status-chip.owned {
      background: linear-gradient(180deg, rgba(255,209,0,0.30), rgba(255,165,0,0.15));
      border: 1px solid rgba(255,209,0,0.65);
      color: var(--tier-gold-color);
      box-shadow: 0 0 10px rgba(255,209,0,0.30);
    }
    .achievement-status-chip.earned {
      background: rgba(21,234,72,0.18);
      border: 1px solid rgba(21,234,72,0.45);
      color: var(--color-preset-green);
    }
    .achievement-status-chip.locked {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: var(--color-on-primary-3);
    }
    /* "Already owned · no need to reach again" subtle tag next to progress label */
    .achievement-not-required {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      margin-left: var(--spacing-2);
      padding: 1px 6px;
      border-radius: var(--radius-xs);
      background: rgba(255,209,0,0.10);
      border: 1px solid rgba(255,209,0,0.30);
      color: var(--tier-gold-color);
      font-size: 9px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.04em;
      vertical-align: middle;
    }
    .achievement-sub.owned {
      color: var(--tier-gold-color);
    }
    .achievement-sub.earned {
      color: var(--color-preset-green);
      font-weight: var(--font-weight-semibold);
    }
    .achievement-sub {
      font-size: var(--font-body-small);
